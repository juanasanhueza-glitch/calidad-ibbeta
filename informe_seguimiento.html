<style>
  :root { --navy:#1b2a4a; --teal:#2f7a72; --teal-light:#e6f2f0; --amber:#c98a1a; --amber-light:#fbf1de; --red:#b3413a; --red-light:#f7e8e6; --green:#3f7d4c; --green-light:#e9f4ea; --border:#c8cdd4; --soft:#5b6472; --bg:#f4f5f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:#101c33; font-size:12.5px; line-height:1.45; }
  .barra { background:var(--navy); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .barra b { font-size:15px; }
  .btn { background:#fff; color:var(--navy); border:0; border-radius:6px; padding:8px 14px; font:inherit; font-weight:600; cursor:pointer; }
  .hoja { max-width:900px; margin:16px auto; background:#fff; border:1px solid #dfe3e8; border-radius:10px; padding:22px 26px; }
  table { width:100%; border-collapse:collapse; }
  th, td { border:1px solid var(--border); padding:5px 7px; text-align:left; vertical-align:top; }
  th { background:#eef1f5; font-size:10.5px; text-transform:uppercase; letter-spacing:.2px; }
  .membrete td { border:1.5px solid #000; vertical-align:middle; }
  .membrete img { max-width:100%; max-height:52px; }
  h1 { font-size:17px; text-align:center; color:var(--navy); margin:16px 0 2px; }
  .sub { text-align:center; color:var(--soft); margin-bottom:14px; }
  h2 { font-size:13.5px; color:var(--navy); margin:18px 0 6px; padding-bottom:3px; border-bottom:2px solid var(--navy); text-transform:uppercase; letter-spacing:.3px; }
  h3 { font-size:13px; margin:0; color:#fff; background:var(--navy); padding:6px 9px; border-radius:4px 4px 0 0; display:flex; justify-content:space-between; gap:8px; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:6px 0 4px; }
  .kpi { border:1px solid #dfe3e8; border-radius:6px; padding:7px 9px; }
  .kpi .v { font-size:20px; font-weight:700; color:var(--navy); }
  .kpi .l { font-size:11px; color:var(--soft); }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:10.5px; font-weight:700; white-space:nowrap; }
  .t-crit { background:var(--red-light); color:var(--red); } .t-may { background:var(--amber-light); color:var(--amber); } .t-men { background:var(--teal-light); color:var(--teal); }
  .t-ok { background:var(--green-light); color:var(--green); } .t-dev { background:var(--red-light); color:var(--red); } .t-rev { background:#e3ecfb; color:#2c5aa0; } .t-pen { background:#eef1f5; color:var(--soft); }
  .hz { margin:14px 0 4px; break-inside:auto; }
  .hz-body { border:1px solid var(--border); border-top:0; padding:8px 10px; border-radius:0 0 4px 4px; }
  .lbl { font-weight:700; color:var(--navy); font-size:11.5px; margin:8px 0 3px; }
  .txt { white-space:pre-wrap; }

const norm = s => (s||'').trim().toLowerCase();
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dmy(v){ if(!v) return ''; const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : v; }
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const ORDEN = {'NC Crítico':0,'NC Mayor':1,'NC Menor':2,'Observación':3,'Mejora':4,'Informativo':5,'N/A':6};
function ordenar(list){
  const om = f => (f.ordenManual===undefined || f.ordenManual===null || f.ordenManual==='') ? 1e9 : Number(f.ordenManual);
  return list.slice().sort((a,b)=>{ const oa=ORDEN[a.criticidad]??99, ob=ORDEN[b.criticidad]??99; if(oa!==ob) return oa-ob; const ma=om(a), mb=om(b); if(ma!==mb) return ma-mb; return (a.id||'').localeCompare(b.id||''); });
}
const requisito = f => (f.requisitoCitado||'').trim() || (f.refCompleta||'').trim() || (f.ref||'').trim() || '-';
const subarea = f => (f.subareaHallazgo||'').trim() || (f.area||'').trim();
const requiere = f => /cr[ií]tico|mayor/i.test(f.criticidad||'');
function tagCrit(c){ const k=/cr[ií]t/i.test(c||'')?'t-crit':/mayor/i.test(c||'')?'t-may':'t-men'; return `<span class="tag ${k}">${esc(c||'Sin clasificar')}</span>`; }

// Estado de la revisión de Calidad (misma regla que la app)
function estadoQA(f){
  if(f.estado === 'Cerrada') return {t:'Cerrado', c:'t-ok'};
  const revs = (f.revisionesQA||[]).filter(r => r.decision !== 'Nota interna');
  const u = revs[revs.length-1];
  if(!f.respondioNombre && !u) return {t:'Sin respuesta', c:'t-pen'};
  if(u){
    const despues = f.respondioTs ? (f.respondioTs > u.ts) : ((f.respondioFecha||'') > (u.fecha||''));
    if(despues) return {t:'Por revisar', c:'t-rev'};
    if(u.decision === 'Aceptado') return {t:'Aceptado', c:'t-ok'};
    return {t:'Devuelto', c:'t-dev'};
  }
  return {t:'Por revisar', c:'t-rev'};
}
function estadoAnalisis(f){
  const a = f.analisisCausa;
  if(a && a.estado==='completado') return {t:'✓ Completado', c:'t-ok'};
  if(a) return {t:'Borrador', c:'t-rev'};
  return requiere(f) ? {t:'Pendiente', c:'t-dev'} : {t:'No requerido', c:'t-pen'};
}
// Acciones: del plan del análisis; si no hay análisis, de la respuesta del portal
function acciones(f){
  const plan = f.analisisCausa && (f.analisisCausa.plan||[]).filter(p=>(p.que||'').trim());
  const base = (plan && plan.length) ? plan.map(p=>({tipo:p.tipo, que:p.que, resp:p.responsable, fecha:p.fecha, estado:p.estado||'Pendiente', evid:p.evidencia||''}))
    : (f.accion||'').trim() ? [{tipo:'Acción', que:f.accion, resp:f.responsable||'', fecha:f.fechaCompromiso||'', estado:f.estado==='Cerrada'?'Implementada':'Pendiente', evid:''}] : [];
  // Verificación de Calidad por acción (última registrada); una acción se considera cerrada solo si Calidad la verificó conforme
  return base.map(x => { const k = String(x.que||'').toLowerCase().replace(/\s+/g,' ').trim().slice(0,120);
    const vs = (f.verificacionesQA||[]).filter(v=>v.clave===k); const v = vs[vs.length-1] || null;
    return Object.assign(x, {verif:v, cerrada: !!(v && v.resultado==='Conforme')}); });
}

async function cargar(){
  const codigo = new URLSearchParams(location.search).get('codigo') || '';
  const doc = document.getElementById('doc');
  if(!codigo){ doc.innerHTML = 'Falta el código del reporte en el enlace (…informe_seguimiento.html?codigo=AUD-XX 01-26).'; return; }
  try{
    const sa = await db.collection('kpi_ibbeta').doc('nt127_auditorias').collection('items').get();
    const audit = sa.docs.map(d=>d.data()).find(a => norm(a.codigoReporte) === norm(codigo));
    if(!audit){ doc.innerHTML = 'No se encontró la auditoría ' + esc(codigo) + '.'; return; }
    const sh = await db.collection('kpi_ibbeta').doc('nt127_hallazgos').collection('items').get();
    const hs = ordenar(sh.docs.map(d=>Object.assign({id:d.id}, d.data())).filter(f => f.auditId === audit.id || (audit.codigoReporte && norm(f.codigoReporte) === norm(audit.codigoReporte))));
    hs.forEach((f,i)=>{ f._n = i+1; });
    render(audit, hs);
  }catch(e){ doc.innerHTML = 'No se pudo cargar la información. Verifique su conexión e intente nuevamente.'; }
}

function render(audit, hs){
  const hoy = hoyISO();
  const todas = hs.flatMap(f => acciones(f).map(a => Object.assign({n:f._n}, a)));
  const impl = todas.filter(a=>a.estado==='Implementada').length;
  const venc = todas.filter(a=>!a.cerrada && a.estado!=='Implementada' && a.fecha && a.fecha < hoy);
  const cerr = todas.filter(a=>a.cerrada).length;
  const req = hs.filter(requiere);
  const kp = [
    [hs.length, 'Hallazgos del reporte'],
    [hs.filter(f=>f.respondioNombre).length + ' / ' + hs.length, 'Con respuesta del área'],
    [req.filter(f=>f.analisisCausa && f.analisisCausa.estado==='completado').length + ' / ' + req.length, 'Análisis de causa (Crít. y Mayor)'],
    [hs.filter(f=>['Aceptado','Cerrado'].includes(estadoQA(f).t)).length + ' / ' + hs.length, 'Planes aceptados o cerrados'],
    [cerr + ' / ' + todas.length, 'Acciones cerradas por Calidad'],
    [venc.length, 'Acciones con fecha vencida'],
    [hs.filter(f=>estadoQA(f).t==='Devuelto').length, 'Devueltos con observaciones'],
    [hs.filter(f=>estadoQA(f).t==='Sin respuesta').length, 'Sin respuesta']
  ];
  const area = audit.areaManual || audit.area || '';
  document.getElementById('doc').innerHTML = `
    <table class="membrete"><tr>
      <td style="width:24%; text-align:center;"><img src="${LOGO}" alt="IBBeta"></td>
      <td style="text-align:center;"><div style="font-weight:700; letter-spacing:2px;">C O N F I D E N C I A L</div><div style="margin-top:4px;"><b>Sección:</b> Aseguramiento de Calidad</div><div style="margin-top:4px;"><b>Informe de Seguimiento de Hallazgos</b></div></td>
      <td style="width:28%; line-height:1.7;"><b>Reporte:</b> ${esc(audit.codigoReporte||'')}<br><b>Auditoría:</b> ${esc(dmy(audit.fecha))}<br><b>Emisión:</b> ${esc(dmy(hoy))}</td>
    </tr></table>
    <h1>Seguimiento del plan de acción</h1>
    <div class="sub">${esc(area)} · Reporte ${esc(audit.codigoReporte||'')} · Estado al ${esc(dmy(hoy))}</div>

    <h2>1. Resumen</h2>
    <div class="kpis">${kp.map(k=>`<div class="kpi"><div class="v">${esc(k[0])}</div><div class="l">${esc(k[1])}</div></div>`).join('')}</div>

    <h2>2. Estado por hallazgo</h2>
    <table><thead><tr><th style="width:5%">N°</th><th style="width:12%">Criticidad</th><th>Hallazgo</th><th style="width:13%">Análisis de causa</th><th style="width:12%">Revisión Calidad</th><th style="width:11%">Acciones impl.</th><th style="width:12%">Próx. compromiso</th></tr></thead><tbody>
      ${hs.map(f => { const ac=acciones(f); const pend=ac.filter(a=>a.estado!=='Implementada' && a.fecha).map(a=>a.fecha).sort(); const ea=estadoAnalisis(f), eq=estadoQA(f);
        const desc=(f.descripcionHallazgo||'').split(/[:.]/)[0];
        return `<tr><td>${f._n}</td><td>${tagCrit(f.criticidad)}</td><td>${esc(desc.length>110?desc.slice(0,110)+'…':desc)}</td><td><span class="tag ${ea.c}">${esc(ea.t)}</span></td><td><span class="tag ${eq.c}">${esc(eq.t)}</span></td><td>${ac.length? ac.filter(a=>a.estado==='Implementada').length+' / '+ac.length : '—'}</td><td>${pend.length? `${esc(dmy(pend[0]))}${pend[0]<hoy?' <span class="tag t-dev">vencida</span>':''}` : '—'}</td></tr>`; }).join('')}
    </tbody></table>

    <h2>3. Acciones por responsable</h2>
    ${(() => { const m = new Map();
      hs.forEach(f => acciones(f).forEach((x,ix) => { const nom = String(x.resp||'').replace(/\s+/g,' ').trim() || 'Sin responsable', k = nom.toLowerCase();
        if(!m.has(k)) m.set(k,{nom,tot:0,cer:0,pen:0,venc:0,cods:[]}); const r = m.get(k); r.tot++;
        if(x.cerrada) r.cer++; else { r.pen++; if(x.fecha && x.fecha < hoy) r.venc++; r.cods.push('H'+f._n+'-A'+(ix+1)); } }));
      const rows = [...m.values()].sort((a,b)=> b.venc-a.venc || b.pen-a.pen || a.nom.localeCompare(b.nom));
      return rows.length ? `<table><thead><tr><th>Responsable</th><th style="width:11%">Comprometidas</th><th style="width:11%">Cerradas por Calidad</th><th style="width:11%">Pendientes</th><th style="width:9%">Vencidas</th><th style="width:24%">Acciones pendientes</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.nom)}</td><td>${r.tot}</td><td>${r.cer}</td><td><b>${r.pen}</b></td><td>${r.venc?`<span class="tag t-dev">${r.venc}</span>`:'0'}</td><td>${r.cods.join(', ')||'—'}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">Sin acciones comprometidas.</div>'; })()}

    <h2>4. Detalle por hallazgo</h2>
    ${hs.map(f => detalle(f, hoy)).join('')}

    <h2>5. Revisión</h2>
    <table class="firmas"><thead><tr><th style="width:22%"></th><th>Nombre / Cargo</th><th style="width:22%">Firma</th><th style="width:14%">Fecha</th></tr></thead><tbody>
      <tr><td><b>Revisado por</b><br><span class="muted">Aseguramiento de Calidad</span></td><td></td><td></td><td></td></tr>
      <tr><td><b>Tomó conocimiento</b><br><span class="muted">Jefatura del área</span></td><td></td><td></td><td></td></tr></tbody></table>
    <div class="nota">Fuente: sistema de auditorías internas de Aseguramiento de Calidad (respuestas del portal, análisis de causa raíz y revisiones de Calidad). Estado de la revisión: Aceptado / Devuelto con observaciones / Por revisar (respuesta nueva sin revisar) / Sin respuesta. Las notas internas de Calidad no se incluyen.</div>
  `;
}

function detalle(f, hoy){
  const a = f.analisisCausa, eq = estadoQA(f), ea = estadoAnalisis(f), ac = acciones(f);
  const revs = (f.revisionesQA||[]).filter(r=>r.decision!=='Nota interna');
  const u = revs[revs.length-1];
  const ORDEN_6M = ['Mano de obra','Método','Máquina','Materiales','Medio ambiente','Medición'];
  const marc = a ? Object.entries(a.seisM||{}).filter(([k,v])=>v && v.aplica).sort((x,y)=>{ const i=ORDEN_6M.indexOf(x[0]), j=ORDEN_6M.indexOf(y[0]); return (i<0?99:i)-(j<0?99:j); }) : [];
  const cad = a ? (a.cadenas||[]).filter(c=>(c.porques||[]).some(p=>(p||'').trim())) : [];
  return `<div class="hz">
    <div class="hz-head-keep"><h3><span>Hallazgo N°${f._n} · ${esc(subarea(f))}</span><span>${esc(f.criticidad||'')}${f.esReincidente?' · Reincidente':''}</span></h3>
    <div class="hz-body">
      <table><tr><th style="width:20%">Requisito</th><td>${esc(requisito(f))}</td></tr>
        <tr><th>Hallazgo</th><td class="txt">${esc(f.descripcionHallazgo||'')}</td></tr>
        <tr><th>Estado</th><td>Análisis de causa: <span class="tag ${ea.c}">${esc(ea.t)}</span> &nbsp; Revisión Calidad: <span class="tag ${eq.c}">${esc(eq.t)}</span>${f.respondioNombre?` &nbsp; <span class="muted">Respondió: ${esc(f.respondioNombre)}${f.respondioFecha?' · '+esc(dmy(f.respondioFecha)):''}</span>`:''}</td></tr></table></div></div>
    <div class="hz-body" style="border-top:0;">
      ${a ? `
        <div class="lbl">Análisis de causa raíz${(a.participantes||[]).length?` <span class="muted" style="font-weight:400;">· Participantes: ${esc((a.participantes||[]).filter(p=>p.nombre).map(p=>p.nombre+(p.cargo?' ('+p.cargo+')':'')).join(', '))} · ${esc(dmy(a.fecha))}</span>`:''}</div>
        ${marc.length?`<table><thead><tr><th style="width:20%">6M</th><th>Lo observado</th></tr></thead><tbody>${marc.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="txt">${esc(v.obs||'')}</td></tr>`).join('')}</tbody></table>`:''}
        ${cad.map((c,i)=>`<table style="margin-top:6px;"><thead><tr><th colspan="2">5 Por qué · cadena ${i+1}${c.m?' ('+esc(c.m)+')':''}</th></tr></thead><tbody>${c.porques.filter(p=>(p||'').trim()).map((p,j)=>`<tr><td style="width:20%">${j+1}° ¿Por qué?</td><td class="txt">${esc(p)}</td></tr>`).join('')}</tbody></table>`).join('')}` : ''}
      <div class="lbl">Causa raíz${(a&&a.sixm)||f.sixm?` <span class="muted" style="font-weight:400;">· 6M: ${esc((a&&a.sixm)||f.sixm)}</span>`:''}</div>
      <div class="txt">${esc(f.causaRaiz || (a&&a.causaRaiz) || '') || '<span class="muted">Sin causa raíz registrada.</span>'}</div>
      <div class="lbl">Plan de acción</div>
      ${ac.length ? `<table><thead><tr><th style="width:8%">Código</th><th style="width:13%">Tipo</th><th>Acción</th><th style="width:15%">Responsable</th><th style="width:10%">Fecha</th><th style="width:16%">Informa el área</th><th style="width:17%">Verificación Calidad</th></tr></thead><tbody>
        ${ac.map((x,ix)=>`<tr><td style="white-space:nowrap; font-weight:600;">H${f._n}-A${ix+1}</td><td>${esc(x.tipo)}</td><td class="txt">${esc(x.que)}</td><td>${esc(x.resp)}</td><td>${esc(dmy(x.fecha))}${!x.cerrada && x.estado!=='Implementada' && x.fecha && x.fecha<hoy?'<br><span class="tag t-dev">vencida</span>':''}</td><td>${esc(x.estado)}${x.evid?`<br><span class="muted">${esc(x.evid)}</span>`:''}</td><td>${x.verif ? (x.cerrada ? `<span class="tag t-ok">Cerrada</span><br><span class="muted">Evidencia recibida el ${esc(dmy(x.verif.fechaRecepcion))}${x.verif.autor?' · '+esc(x.verif.autor):''}</span>` : `<span class="tag t-dev">No conforme</span><br><span class="muted">${esc(dmy(x.verif.fechaRecepcion))}${x.verif.obs?' · '+esc(x.verif.obs):''}</span>`) : '<span class="muted">Por verificar</span>'}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">Sin plan de acción registrado.</div>'}
      ${(f.eficaciaQA||[]).length ? (e => `<div class="lbl">Verificación de eficacia · ${esc(e.resultado)} · ${esc(dmy(e.fecha))}${e.autor?' · '+esc(e.autor):''}</div><div class="txt">${esc(e.evidencia||'')}</div>`)(f.eficaciaQA[f.eficaciaQA.length-1]) : ''}
      ${u ? `<div class="lbl">Última revisión de Calidad · ${esc(u.decision)} · ${esc(dmy(u.fecha))}${u.autor?' · '+esc(u.autor):''}</div><div class="txt">${esc(u.texto||'')}</div>` : ''}
      ${(f.fotosMejora||[]).length ? `<div class="lbl">Evidencia fotográfica de la mejora</div><div class="fotos">${f.fotosMejora.map(src=>`<img src="${src}">`).join('')}</div>` : ''}
    </div>
  </div>`;
}
cargar();
</script>
</body>
</html>
