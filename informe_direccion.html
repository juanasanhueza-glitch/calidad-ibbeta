<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe a la Dirección – Auditorías Internas</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-0: #f4f5f7;
    --surface-1: #ffffff;
    --border: #e1e4e9;
    --text-primary: #16202e;
    --text-secondary: #4f5866;
    --text-muted: #7c8592;
    --navy: #1b2a4a;
    --teal: #2f7a72;
    --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #5598e7; --seq-4: #256abf; --seq-5: #104281;
    --st-critical: #d03b3b;
    --st-serious: #ec835a;
    --st-warning: #fab219;
    --st-good: #0ca30c;
    --st-neutral: #9aa1ab;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--surface-0); color: var(--text-primary); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; }
  header.top { background: var(--navy); color:#fff; }
  header.top .wrap { padding-top:18px; padding-bottom:18px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  header.top h1 { margin:0; font-size:22px; letter-spacing:.2px; }
  header.top .sub { color:#c9d3e4; font-size:13px; margin-top:4px; }
  header.top .acciones { display:flex; gap:8px; align-items:center; }
  header.top select, header.top button { font-size:13px; padding:7px 12px; border-radius:6px; border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; cursor:pointer; }
  header.top select option { color:#000; }
  h2 { font-size:16px; margin: 30px 0 4px; color: var(--navy); }
  .h2sub { font-size:12.5px; color: var(--text-secondary); margin: 0 0 12px; }
  .card { background: var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:16px 18px; }
  .grid-kpi { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:12px; }
  .kpi .v { font-size:30px; font-weight:700; line-height:1.1; color: var(--text-primary); }
  .kpi .l { font-size:12.5px; color: var(--text-secondary); margin-top:4px; }
  .kpi .d { font-size:11.5px; color: var(--text-muted); margin-top:6px; }
  .kpi .marca { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .mensajes li { margin: 6px 0; font-size:14px; line-height:1.45; }
  table.t { width:100%; border-collapse:collapse; font-size:13px; }
  table.t th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; color: var(--text-secondary); border-bottom:1px solid var(--border); padding:8px 8px; font-weight:600; }
  table.t td { border-bottom:1px solid var(--border); padding:8px 8px; vertical-align:top; }
  table.t td.num, table.t th.num { text-align:center; }
  .heat td.c { text-align:center; font-weight:700; border:2px solid var(--surface-1); border-radius:4px; min-width:56px; }
  .chip { display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:10px; background:#eef1f5; color: var(--text-secondary); margin:2px 4px 2px 0; }
  .sev { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color: var(--text-primary); white-space:nowrap; }
  .sev i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .estado { font-size:12px; font-weight:600; white-space:nowrap; }
  .barra { display:flex; height:22px; border-radius:4px; overflow:hidden; background:#eef1f5; }
  .barra span { height:100%; border-right:2px solid var(--surface-1); }
  .barra span:last-child { border-right:0; }
  .tema-fila { display:grid; grid-template-columns: 230px 1fr 46px; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); }
  .tema-fila .nom { font-size:13.5px; font-weight:600; }
  .tema-fila .areas { grid-column: 2 / 4; margin-top:-2px; }
  .tema-fila .tot { font-weight:700; text-align:right; }
  .leyenda { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color: var(--text-secondary); margin-bottom:8px; }
  .leyenda span { display:inline-flex; align-items:center; gap:5px; }
  .leyenda i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .prog { display:grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap:8px; }
  .prog .it { border:1px solid var(--border); border-radius:8px; padding:10px 12px; background: var(--surface-1); font-size:13px; }
  .prog .it .n { font-weight:600; }
  .prog .it .e { font-size:12px; margin-top:4px; }
  .nota { font-size:12px; color: var(--text-muted); margin-top:10px; }
  .vacio { color: var(--text-muted); font-size:13px; padding:10px 0; }
  .resp-fila { display:grid; grid-template-columns: 1.4fr 70px 2fr; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
  .resp-fila .q { font-weight:600; font-size:13.5px; }
  .resp-fila .c { font-size:12px; color: var(--text-secondary); }
  #tip { position:fixed; pointer-events:none; z-index:50; background:#16202e; color:#fff; font-size:12px; padding:7px 10px; border-radius:6px; max-width:320px; line-height:1.4; display:none; box-shadow:0 4px 14px rgba(0,0,0,.2); }
  .estado-carga { padding:30px; text-align:center; color: var(--text-secondary); }
  @media (max-width: 760px) { .tema-fila { grid-template-columns: 1fr 40px; } .tema-fila .barra { grid-column: 1 / 3; } .tema-fila .areas { grid-column: 1 / 3; } .resp-fila { grid-template-columns: 1fr 60px; } .resp-fila .barra { grid-column: 1/3; } }
  /* ---------- Documento: membrete, portada y firmas ---------- */
  .marco, .marco > tbody, .marco > tbody > tr, .marco > tbody > tr > td { display:block; }
  .marco > thead { display:none; }
  .membrete { width:100%; border-collapse:collapse; table-layout:fixed; border:1.5px solid #000; background:#fff; }
  .membrete td { border:1px solid #000; vertical-align:middle; padding:6px 10px; font-size:10.5px; color:#000; }
  .membrete .m-logo { width:24%; text-align:center; }
  .membrete .m-logo img { max-width:100%; height:auto; max-height:56px; }
  .membrete .m-centro { width:50%; text-align:center; }
  .membrete .m-conf { font-weight:700; letter-spacing:2px; font-size:11px; }
  .membrete .m-der { width:26%; line-height:1.6; }
  .portada { background:#fff; border:1px solid var(--border); border-radius:10px; padding:22px 26px; margin-top:4px; }
  .portada h1 { font-size:22px; color:var(--navy); margin:4px 0 2px; text-align:center; }
  .portada .p-sub { text-align:center; color:var(--text-secondary); font-size:13px; margin-bottom:16px; }
  .portada h3 { font-size:13px; color:var(--navy); margin:16px 0 6px; text-transform:uppercase; letter-spacing:.4px; }
  .portada p { font-size:13px; line-height:1.5; margin:0; color:var(--text-primary); }
  .p-caja { border:4px double #000; background:#eef4f9; text-align:center; padding:26px 20px; margin:70px 30px 34px; color:#14245c; }
  .p-caja .p-t1 { font-size:24px; font-weight:700; }
  .p-caja .p-t2 { font-size:19px; font-weight:700; margin-top:14px; }
  .p-caja .p-t3 { font-size:17px; margin-top:12px; }
  .pag2 { margin-top:14px; }
  .indice-v { font-size:13.5px; line-height:1.9; margin:0 0 6px; padding-left:0; list-style:none; }
  table.firmas, table.dist { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
  table.firmas th, table.firmas td, table.dist th, table.dist td { border:1px solid #9aa1ab; padding:7px 8px; text-align:left; vertical-align:middle; }
  table.firmas th, table.dist th { background:#eef1f5; font-size:11px; text-transform:uppercase; letter-spacing:.3px; }
  table.firmas td { height:46px; }
  .indice { columns:2; font-size:12.5px; margin:0; padding-left:18px; }
  .indice li { margin:3px 0; }
  .sec-titulo { break-after:avoid; }
  body.es-borrador::before { content:'BORRADOR'; position:fixed; top:45%; left:50%; transform:translate(-50%,-50%) rotate(-30deg); font-size:110px; font-weight:800; letter-spacing:12px; color:rgba(200,40,40,.08); pointer-events:none; z-index:50; }
  /* ---------- Impresión paginada (hojas armadas por script) ---------- */
  #impresion { display:none; }
  #impresion.midiendo { display:block; position:absolute; left:-99999px; top:0; }
  .hoja { width:215.9mm; height:279.4mm; padding:10mm 11mm 0; box-sizing:border-box; position:relative; overflow:hidden; background:#fff; }
  .hoja .cuerpo { overflow:hidden; }
  .hoja .pie { position:absolute; left:11mm; right:11mm; bottom:6mm; display:flex; justify-content:space-between; font-size:8pt; color:#7c8592; }
  .hoja .membrete { margin-bottom:9px; }
  body.es-borrador .hoja::before { content:'BORRADOR'; position:absolute; top:48%; left:50%; transform:translate(-50%,-50%) rotate(-30deg); font-size:110px; font-weight:800; letter-spacing:12px; color:rgba(200,40,40,.08); pointer-events:none; z-index:5; }
  .pg { font-size:13px; }
  .pg .portada { border:0; padding:0; margin:0; }
  .pg h2 { font-size:14px; margin:12px 0 3px; }
  .pg .h2sub { font-size:11px; margin-bottom:8px; }
  .pg .card { padding:10px 12px; border-radius:6px; overflow:visible !important; margin-bottom:10px; }
  .pg table.t { font-size:10.5px; }
  .pg table.t th { font-size:9px; padding:5px 6px; }
  .pg table.t td { padding:5px 6px; }
  .pg .mensajes li { font-size:12px; }
  .pg .kpi .v { font-size:24px; }
  .pg .grid-kpi { grid-template-columns: repeat(3, 1fr); gap:8px; }
  .pg .prog { grid-template-columns: repeat(3, 1fr); gap:6px; }
  .pg .prog .it { padding:6px 8px; font-size:11px; }
  .pg .tema-fila { grid-template-columns: 190px 1fr 36px; padding:4px 0; }
  .pg .tema-fila .barra { height:16px; }
  .pg .tema-fila .areas { margin-top:-4px; }
  .pg .chip { font-size:9.5px; padding:1px 6px; }
  .pg .estado { white-space:normal; }
  .pg .criterios { font-size:9.5px !important; line-height:1.35 !important; }
  .pg .no-print { display:none !important; }
  .pg .p-caja { margin:60px 30px 30px; }
  .indice-v .pn { display:none; }
  .pg .indice-v { list-style:none; padding-left:0; }
  .pg .indice-v li { display:flex; align-items:baseline; gap:6px; }
  .pg .indice-v .lead { flex:1; border-bottom:1px dotted #9aa1ab; transform:translateY(-4px); }
  .pg .indice-v .pn { display:inline; min-width:18px; text-align:right; font-weight:600; }
  @media print {
    @page { size: letter; margin: 0; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body, .viz-root { background:#fff; }
    body.es-borrador::before { display:none; }
    header.top, .marco, #tip { display:none !important; }
    #impresion { display:block !important; position:static !important; }
    .hoja { break-after:page; }
    .hoja:last-child { break-after:auto; }
  }
</style>
</head>

  {k:'NC Crítico', c:'var(--st-critical)'},
  {k:'NC Mayor',   c:'var(--st-serious)'},
  {k:'NC Menor',   c:'var(--st-warning)'},
  {k:'Observación',c:'var(--st-neutral)'}
];
function sevDe(f){ const c = (f.criticidad||'').trim(); return SEV.find(s=>s.k===c) ? c : (/obs|mejora/i.test(c) ? 'Observación' : (c || 'Observación')); }
function sevColor(k){ const s = SEV.find(x=>x.k===k); return s ? s.c : 'var(--st-neutral)'; }

function esReincidente(f){ return !!(f.esReincidente || f.vinculoTipo==='Reincidente' || /^\s*\[Reincidente/i.test(f.descripcionHallazgo||'')); }
function estadoPlan(f){
  if(f.estado === 'Cerrada') return {k:'cerrado', txt:'Cerrado', c:'var(--st-good)'};
  const revs = (f.revisionesQA||[]).filter(r => r.decision !== 'Nota interna');
  const u = revs[revs.length-1];
  const respondido = !!((f.causaRaiz||'').trim() && (f.accion||'').trim());
  if(u){
    const respDespues = f.respondioTs ? (f.respondioTs > u.ts) : ((f.respondioFecha||'') > (u.fecha||''));
    if(!respDespues && u.decision === 'Aceptado') return {k:'aceptado', txt:'Plan aceptado por QA', c:'var(--teal)'};
    if(!respDespues) return {k:'devuelto', txt:'Devuelto con observaciones', c:'var(--st-serious)'};
  }
  if(respondido) return {k:'respondido', txt:'Plan recibido (por revisar)', c:'var(--seq-4)'};
  return {k:'pendiente', txt:'Sin plan de acción', c:'var(--st-critical)'};
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fFecha(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso||''); }
function corto(t, n){ t = String(t||'').replace(/^\s*\[[^\]]*\]\s*/,'').replace(/\s+/g,' ').trim(); return t.length>n ? t.slice(0,n-1)+'…' : t; }
function pct(a,b){ return b ? Math.round(a*100/b) : 0; }

// ======================= DATOS =======================
let AUD = [], HAL = [];
async function cargar(){
  const [sa, sh] = await Promise.all([
    db.collection('kpi_ibbeta').doc('nt127_auditorias').collection('items').get(),
    db.collection('kpi_ibbeta').doc('nt127_hallazgos').collection('items').get()
  ]);
  AUD = sa.docs.map(d=>d.data());
  HAL = sh.docs.map(d=>d.data());
}

// ======================= RENDER =======================
// Ordena el texto libre de los reportes: separa los ítems que vienen pegados ("...:Oportunidad:") y quita espacios sobrantes.
function limpiarTexto(t){
  return String(t||'').replace(/\r/g,'')
    .replace(/[.:]?\s*([^.:\n]{3,90}):\s*Oportunidad:\s*/g, (m,tit)=>'\n\n• '+tit.trim()+': ')
    .replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
function render(anio){
  const auds = AUD.filter(a => (a.fecha||'').slice(0,4) === anio);
  const audById = Object.fromEntries(auds.map(a=>[a.id, a]));
  const hal = HAL.filter(f => audById[f.auditId]).map(f => {
    const a = audById[f.auditId];
    const ai = areaInfo(a.areaManual || '');
    return {...f, _aud:a, _area:ai.corto, _jef:ai.jefatura, _ger:ai.gerencia, _san:ai.sanitario, _tema:temaDe(f), _sev:sevDe(f), _rein:esReincidente(f), _plan:estadoPlan(f)};
  });

  const prog = PROGRAMA[anio] || [];
  const filasProg = prog.map(p => {
    const a = auds.find(x => p.m.test(x.areaManual||''));
    let estado, color;
    if(p.nota && !a){ estado = p.nota; color = 'var(--text-muted)'; }
    else if(!a){ estado = 'Pendiente'; color = 'var(--st-warning)'; }
    else if(a.estado === 'finalizada'){ estado = 'Ejecutada · ' + (a.codigoReporte||''); color = 'var(--st-good)'; }
    else { estado = 'En curso · ' + (a.codigoReporte||'') + (a.fecha ? ' · ' + fFecha(a.fecha) : ''); color = 'var(--seq-4)'; }
    return {t:p.t, estado, color, ejecutada: !!a && a.estado==='finalizada', reprog: !!p.nota && !a};
  });
  const nProg = filasProg.filter(x=>!x.reprog).length;
  const nEjec = filasProg.filter(x=>x.ejecutada).length;

  const tot = hal.length;
  const nSev = k => hal.filter(f=>f._sev===k).length;
  const nRein = hal.filter(f=>f._rein).length;
  const fechaHoy = (d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear())(new Date());
  const nPlan = hal.filter(f=>['cerrado','aceptado','respondido','devuelto'].includes(f._plan.k)).length;

  // Áreas (con hallazgos), ordenadas por gravedad
  const mejoras = auds.filter(a => (a.notasAdicionales||'').trim()).map(a => ({area: areaInfo(a.areaManual||'').corto, codigo: a.codigoReporte||'', texto: limpiarTexto(a.notasAdicionales)}));
  const areas = [...new Set(hal.map(f=>f._area))];
  const peso = a => hal.filter(f=>f._area===a).reduce((s,f)=> s + ({'NC Crítico':100,'NC Mayor':10,'NC Menor':1}[f._sev]||0), 0);
  areas.sort((a,b)=>peso(b)-peso(a));

  // Temas
  const temas = [...new Set(TEMAS.map(t=>t.t))].concat(['Otros']).map(t => {
    const fs = hal.filter(f=>f._tema===t);
    return {t, fs, areas:[...new Set(fs.map(f=>f._area))], pedido:(TEMAS.find(x=>x.t===t && x.pedido)||{}).pedido};
  }).filter(x=>x.fs.length).sort((a,b)=> b.areas.length - a.areas.length || b.fs.length - a.fs.length);
  const maxTema = Math.max(1, ...temas.map(x=>x.fs.length));

  // Prioritarios: críticos + mayores reincidentes
  const prioritarios = hal.filter(f => f._sev==='NC Crítico' || (f._sev==='NC Mayor' && f._rein))
    .sort((a,b)=> (a._sev==='NC Crítico'?0:1) - (b._sev==='NC Crítico'?0:1));

  // Por cargo sanitario
  const porSan = CARGOS_SANITARIOS.concat([{cargo:'Gerente General', nombre:'German Pinilla'}]).map(c => {
    const fs = hal.filter(f=>f._san===c.cargo);
    return {...c, fs, areas:[...new Set(fs.map(f=>f._area))],
      cer: fs.filter(f=>f._plan.k==='cerrado').length, acp: fs.filter(f=>f._plan.k==='aceptado').length, res: fs.filter(f=>f._plan.k==='respondido').length, dev: fs.filter(f=>f._plan.k==='devuelto').length, pen: fs.filter(f=>f._plan.k==='pendiente').length,
      crit: fs.filter(f=>f._sev==='NC Crítico').length};
  });

  // Mensajes clave (se generan con los datos)
  // Columnas del mapa: Observación solo si existen observaciones en el periodo
  const SEV_MAPA = SEV.filter(x => x.k!=='Observación' || hal.some(f=>f._sev===x.k));
  const temaTop = temas.find(t=>t.t!=='Otros');
  const areaTop = areas[0];
  const mensajes = [];
  if(tot) mensajes.push(`Se levantaron <b>${tot} hallazgos</b> en ${new Set(hal.map(f=>f._aud.id)).size} auditorías: <b>${nSev('NC Crítico')} críticos</b> y <b>${nSev('NC Mayor')} mayores</b>, cuya gestión se coordina con las jefaturas de cada área.`);
  if(temaTop) mensajes.push(`La principal debilidad del sistema es <b>${esc(temaTop.t.charAt(0).toLowerCase()+temaTop.t.slice(1))}</b>: se repite en <b>${temaTop.areas.length} de ${areas.length} áreas</b> (${temaTop.fs.length} hallazgos). Al ser transversal, su causa es del sistema de calidad y no de un área en particular.`);
  if(areaTop) mensajes.push(`El área con más hallazgos de alta criticidad es <b>${esc(areaTop)}</b>, con ${hal.filter(f=>f._area===areaTop).length} hallazgos (${(n=>n===1?'1 crítico':n+' críticos')(hal.filter(f=>f._area===areaTop && f._sev==='NC Crítico').length)}).`);
  if(tot) mensajes.push(`<b>${pct(nRein,tot)}%</b> de los hallazgos son <b>reincidencias</b> de auditorías anteriores (${nRein}), por lo que conviene reforzar el seguimiento de la eficacia de las acciones.`);
  if(tot) mensajes.push(`<b>${pct(nPlan,tot)}%</b> de los hallazgos tiene plan de acción registrado (${nPlan} de ${tot}); los ${tot-nPlan} restantes están en proceso de respuesta.`);

  const sevLegend = `<div class="leyenda">${SEV.slice(0,3).map(s=>`<span><i style="background:${s.c}"></i>${s.k}</span>`).join('')}<span><i style="background:${SEV[3].c}"></i>Observación</span></div>`;
  const maxCelda = Math.max(1, ...areas.flatMap(a => SEV.map(s => hal.filter(f=>f._area===a && f._sev===s.k).length)));
  const colorCelda = n => { if(!n) return {bg:'#f3f5f8', fg:'var(--text-muted)'}; const r = n/maxCelda; const steps=['--seq-1','--seq-2','--seq-3','--seq-4','--seq-5']; const i = Math.min(4, Math.floor(r*4.999)); return {bg:`var(${steps[i]})`, fg: i>=2 ? '#fff' : 'var(--text-primary)'}; };

  document.getElementById('sub').textContent = `Aseguramiento de Calidad · Programa ${anio} · Datos al ${(d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear())(new Date())} · Dirigido a: ${DISTRIBUCION.map(c=>c.cargo).join(', ')}`;

  ANIO_ACTUAL = anio;
  document.querySelectorAll('.m-periodo').forEach(e=>e.textContent=anio);
  document.querySelectorAll('.m-fecha').forEach(e=>e.textContent=fechaHoy);
  const portada = `<section class="portada">
      <div class="p-caja">
        <div class="p-t1">Informe de Auditorías Internas</div>
        <div class="p-t2">Revisión por la Dirección</div>
        <div class="p-t3">Programa de auditorías internas</div>
        <div class="p-t3"><b>Periodo:</b> ${anio}</div>
      </div>
      <div style="text-align:center; font-size:12.5px; color:var(--text-secondary); margin:-18px 0 18px;">Estado: <b>${ESTADO_INFORME==='APROBADO'?'Aprobado':'Borrador'}</b> · Datos al ${fechaHoy}</div>
      <h3>Dirigido a</h3>
      <table class="dist"><thead><tr><th style="width:45%">Cargo</th><th>Nombre</th></tr></thead><tbody>${DISTRIBUCION.map(d=>`<tr><td>${esc(d.cargo)}</td><td>${esc(d.nombre)}</td></tr>`).join('')}</tbody></table>
      <h3>Control del documento</h3>
      <table class="firmas"><thead><tr><th style="width:16%"></th><th style="width:32%">Nombre / Cargo</th><th style="width:24%">Rol</th><th style="width:16%">Firma</th><th style="width:12%">Fecha</th></tr></thead>
        <tbody>${CONTROL_DOC.map(c=>`<tr><td><b>${esc(c.rol)}</b></td><td>${esc(c.nombre)}<br><span style="color:var(--text-secondary)">${esc(c.cargo)}</span></td><td>${esc(c.funcion)}</td><td></td><td></td></tr>`).join('')}</tbody></table>
    </section>
    <section class="portada pag2">
      <h3>Contenido</h3>
      <ol class="indice-v"><li data-sec="1"><span>1. Mensajes clave</span><span class="lead"></span><span class="pn"></span></li><li data-sec="2"><span>2. Resultados del programa</span><span class="lead"></span><span class="pn"></span></li><li data-sec="3"><span>3. Mapa de riesgo por área</span><span class="lead"></span><span class="pn"></span></li><li data-sec="4"><span>4. Debilidades del sistema de calidad</span><span class="lead"></span><span class="pn"></span></li><li data-sec="5"><span>5. Hallazgos prioritarios e impacto sanitario</span><span class="lead"></span><span class="pn"></span></li><li data-sec="6"><span>6. Avance de los planes de acción por cargo</span><span class="lead"></span><span class="pn"></span></li><li data-sec="7"><span>7. Requerimientos a la Dirección</span><span class="lead"></span><span class="pn"></span></li><li data-sec="8"><span>8. Oportunidades de mejora y observaciones por área</span><span class="lead"></span><span class="pn"></span></li><li data-sec="9"><span>9. Criterios del informe</span><span class="lead"></span><span class="pn"></span></li></ol>
      <h3>Objetivo</h3>
      <p>Informar a la Dirección el resultado del programa de auditorías internas ${anio}, las debilidades del sistema de calidad identificadas, los hallazgos de mayor impacto sanitario y el estado de los planes de acción, como antecedente para la Revisión por la Dirección y para apoyar la toma de decisiones y la asignación de recursos.</p>
      <h3>Alcance</h3>
      <p>Considera las auditorías internas del programa ${anio} registradas en el sistema de auditorías de Aseguramiento de Calidad, con los datos disponibles al ${fechaHoy}. Las auditorías en curso se informan con los hallazgos registrados a esa fecha.</p>
    </section>`;
  document.getElementById('contenido').innerHTML = portada + `
    <h2 class="sec-titulo" data-sec="1">1. Mensajes clave</h2>
    <p class="h2sub">Lo que la Dirección debe saber, en cinco puntos.</p>
    <div class="card"><ul class="mensajes" style="margin:0; padding-left:20px;">${mensajes.map(m=>`<li>${m}</li>`).join('') || '<li>Sin hallazgos registrados para este año.</li>'}</ul></div>

    <h2 class="sec-titulo" data-sec="2">2. Resultados del programa</h2>
    <p class="h2sub">Indicadores principales de las auditorías internas ${anio}.</p>
    <div class="grid-kpi">
      <div class="card kpi"><div class="v">${nEjec} / ${nProg}</div><div class="l">Auditorías ejecutadas</div><div class="d">del programa anual ${anio}</div></div>
      <div class="card kpi"><div class="v">${tot}</div><div class="l">Hallazgos totales</div><div class="d">en auditorías ${anio}</div></div>
      <div class="card kpi"><div class="v">${nSev('NC Crítico')}</div><div class="l"><span class="marca" style="background:var(--st-critical)"></span>NC Críticos</div><div class="d">riesgo directo para el paciente o la liberación</div></div>
      <div class="card kpi"><div class="v">${nSev('NC Mayor')}</div><div class="l"><span class="marca" style="background:var(--st-serious)"></span>NC Mayores</div><div class="d">afectan calidad, trazabilidad o registros</div></div>
      <div class="card kpi"><div class="v">${pct(nRein,tot)}%</div><div class="l">Reincidencia</div><div class="d">${nRein} hallazgos repetidos de auditorías anteriores</div></div>
      <div class="card kpi"><div class="v">${pct(nPlan,tot)}%</div><div class="l">Con plan de acción</div><div class="d">${nPlan} de ${tot} hallazgos respondidos</div></div>
    </div>
    <div class="card" style="margin-top:12px;">
      <div style="font-weight:600; font-size:13.5px; margin-bottom:10px;">Avance del programa anual</div>
      <div class="prog">${filasProg.map(p=>`<div class="it"><div class="n">${esc(p.t)}</div><div class="e" style="color:${p.color}">● ${esc(p.estado)}</div></div>`).join('')}</div>
    </div>

    <h2 class="sec-titulo sec-nueva" data-sec="3">3. Mapa de riesgo por área</h2>
    <p class="h2sub">Cantidad de hallazgos por área y criticidad. Las áreas están ordenadas de mayor a menor riesgo.</p>
    <div class="card" style="overflow-x:auto;">
      ${areas.length ? `<table class="t heat">
        <thead><tr><th>Área</th>${SEV_MAPA.map(s=>`<th class="num"><span class="sev"><i style="background:${s.c}"></i>${s.k}</span></th>`).join('')}<th class="num">Total</th><th style="width:30%">Jefatura del área / cargo sanitario</th></tr></thead>
        <tbody>${areas.map(a => {
          const fs = hal.filter(f=>f._area===a);
          return `<tr><td><b>${esc(a)}</b><div class="c" style="font-size:11.5px; color:var(--text-muted)">${esc(fs[0]._aud.codigoReporte||'')}</div></td>
            ${SEV_MAPA.map(s => { const n = fs.filter(f=>f._sev===s.k).length; const col = colorCelda(n);
              return `<td class="c" style="background:${col.bg}; color:${col.fg}" data-tip="${esc(a)} · ${s.k}: ${n} hallazgo(s)">${n||'–'}</td>`; }).join('')}
            <td class="num"><b>${fs.length}</b></td><td style="font-size:12px;">${esc(fs[0]._jef)}<div style="color:var(--text-muted)">${esc(fs[0]._san)}</div></td></tr>`;
        }).join('')}</tbody></table>` : '<div class="vacio">Sin hallazgos registrados.</div>'}
    </div>

    <h2 class="sec-titulo sec-nueva" data-sec="4">4. Debilidades del sistema de calidad</h2>
    <p class="h2sub">Hallazgos agrupados por tema. Un tema que aparece en varias áreas indica una falla del sistema, que debe abordarse de forma transversal y no área por área. Bajo cada tema se indica, como referencia, el artículo del D.S. N° 3/2010 relacionado.</p>
    <div class="card">
      ${sevLegend}
      ${temas.map(t => `<div class="tema-fila">
        <div class="nom">${esc(t.t)}<div style="font-size:11.5px; font-weight:400; color:var(--text-muted)">${t.areas.length} área(s)</div>${DS3_TEMA[t.t]?`<div style="font-size:10px; font-weight:400; color:var(--text-muted); margin-top:2px;">Ref. D.S. 3/2010, ${esc((DS3_TEMA[t.t].match(/Art\.[^;]*/g)||[]).join('; ').replace(/^Art\./,'Art.'))}</div>`:''}</div>
        <div class="barra" style="width:${Math.max(8, t.fs.length*100/maxTema)}%">${SEV.map(s => { const n = t.fs.filter(f=>f._sev===s.k).length; return n ? `<span style="flex:${n}; background:${s.c}" data-tip="${esc(t.t)} · ${s.k}: ${n}"></span>` : ''; }).join('')}</div>
        <div class="tot">${t.fs.length}</div>
        <div class="areas">${t.areas.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div>
      </div>`).join('') || '<div class="vacio">Sin hallazgos registrados.</div>'}
    </div>

    <h2 class="sec-titulo sec-nueva" data-sec="5">5. Hallazgos prioritarios e impacto sanitario</h2>
    <p class="h2sub">Hallazgos críticos y hallazgos mayores reincidentes: son los que observaría con mayor probabilidad una inspección del ISP (N.T. 127 / D.S. N° 3/2010) y los que requieren seguimiento directo de la jefatura sanitaria.</p>
    <div class="card" style="overflow-x:auto;">
      ${prioritarios.length ? `<table class="t" style="table-layout:fixed;"><colgroup><col style="width:11%"><col style="width:13%"><col style="width:40%"><col style="width:14%"><col style="width:10%"><col style="width:12%"></colgroup><thead><tr><th>Criticidad</th><th>Área</th><th>Hallazgo</th><th>Requisito</th><th>Responde</th><th>Plan de acción</th></tr></thead><tbody>
        ${prioritarios.map(f => `<tr>
          <td><span class="sev"><i style="background:${sevColor(f._sev)}"></i>${esc(f._sev)}</span>${f._rein?'<div class="chip" style="margin-top:4px;">Reincidente</div>':''}</td>
          <td>${esc(f._area)}<div style="font-size:11.5px; color:var(--text-muted)">${esc(f._aud.codigoReporte||'')}</div></td>
          <td>${esc(corto(f.descripcionHallazgo||f.requerimiento, 260))}</td>
          <td style="font-size:12px; color:var(--text-secondary)">${esc(corto(f.ref, 120))}</td>
          <td style="font-size:12px;">${esc(f._san)}</td>
          <td><span class="estado" style="color:${f._plan.c}">● ${f._plan.txt}</span>${f.fechaCompromiso?`<div style="font-size:11.5px; color:var(--text-muted)">Compromiso: ${fFecha(f.fechaCompromiso)}</div>`:''}</td>
        </tr>`).join('')}</tbody></table>` : '<div class="vacio">No hay hallazgos críticos ni mayores reincidentes.</div>'}
    </div>

    <h2 class="sec-titulo" data-sec="6">6. Avance de los planes de acción por cargo</h2>

    <div class="card no-romper">
      <div class="leyenda"><span><i style="background:var(--st-good)"></i>Cerrado</span><span><i style="background:var(--teal)"></i>Plan aceptado por QA</span><span><i style="background:var(--seq-4)"></i>Plan recibido (por revisar)</span><span><i style="background:var(--st-serious)"></i>Devuelto con observaciones</span><span><i style="background:var(--st-critical)"></i>Sin plan de acción</span></div>
      ${porSan.map(c => `<div class="resp-fila">

        <div style="font-weight:700; text-align:center;">${c.fs.length}<div class="c" style="font-weight:400;">hallazgos</div></div>

    <div class="card">
      <ol style="margin:0; padding-left:20px;">
        ${temas.filter(t=>t.areas.length>=2 && t.pedido).slice(0,5).map(t => `<li style="margin:8px 0; font-size:14px;"><b>${esc(t.t)}</b> (${t.areas.length} áreas, ${t.fs.length} hallazgos): ${esc(t.pedido)}</li>`).join('') || '<li>Sin temas transversales en este período.</li>'}
      </ol>
      <div class="nota">Propuesta generada a partir de los temas que se repiten en dos o más áreas; debe ser validada por Aseguramiento de Calidad antes de presentarse.</div>
    </div>

    <h2 class="sec-titulo sec-nueva" data-sec="8">8. Oportunidades de mejora y observaciones por área</h2>
    <p class="h2sub">Resumen de lo informado en la sección «Observaciones adicionales / Puntos de mejora» de cada reporte de auditoría. No constituyen No Conformidades, pero orientan la mejora del sistema.</p>
    <div class="card">
      ${mejoras.length ? `<table class="t" style="table-layout:fixed;"><colgroup><col style="width:22%"><col></colgroup><thead><tr><th>Área / reporte</th><th>Oportunidades de mejora y observaciones</th></tr></thead><tbody>${mejoras.map(m=>`<tr><td><b>${esc(m.area)}</b><div style="color:var(--text-muted); font-size:11.5px;">${esc(m.codigo)}</div></td><td style="white-space:pre-wrap; line-height:1.45;">${esc(m.texto)}</td></tr>`).join('')}</tbody></table>` : '<div class="vacio">Los reportes del periodo no registran observaciones adicionales ni puntos de mejora.</div>'}
    </div>

    <h2 class="sec-titulo" data-sec="9">9. Criterios del informe</h2>
    <div class="card no-romper criterios" style="font-size:12.5px; color:var(--text-secondary); line-height:1.5;">
      <b>Fuente:</b> registros de la app de auditorías internas (F-QA-009.03), actualizados en línea. <b>Marco normativo:</b> N.T. N° 127 (BPM) y D.S. N° 3/2010 del Ministerio de Salud, Arts. 148 a 158 (personal y responsabilidades; versión Ley Chile, última modificación 21-08-2020, Decreto 65). <b>Criticidad:</b> NC Crítico, puede generar un producto perjudicial para el paciente o impedir controlar la liberación; NC Mayor, puede afectar la calidad, la trazabilidad o la integridad de los registros (incluye reincidencia de un hallazgo menor); NC Menor, desviación puntual sin impacto directo en la calidad. <b>Tema:</b> se asigna según el requisito normativo citado en cada hallazgo. <b>Plan de acción:</b> se considera recibido cuando el área registró causa raíz y acción en el portal del auditado; luego Aseguramiento de Calidad lo acepta o lo devuelve con observaciones. <b>Plazo de respuesta:</b> 45 días hábiles desde la recepción del reporte (SOP QA-009).
    </div>
  `;
}

// ---------- Armado de hojas para imprimir (membrete con Pág. X de Y e índice con páginas) ----------
const LOGO_SRC = (document.querySelector('.membrete .m-logo img')||{}).src || '';
function membreteHtml(i, n){
  return `<table class="membrete"><tr>
    <td class="m-logo"><img src="${LOGO_SRC}" alt="Instituto Bioquímico Beta S.A."></td>
    <td class="m-centro"><div class="m-conf">C O N F I D E N C I A L</div><div style="margin-top:5px;"><b>Sección:</b> Aseguramiento de Calidad</div><div style="margin-top:5px;"><b>Informe de Auditorías Internas a la Dirección</b></div></td>
    <td class="m-der"><div><b>Periodo:</b> ${esc(ANIO_ACTUAL)}</div><div><b>Edición:</b> ${esc(EDICION_INFORME)}</div><div><b>Pág.:</b> ${i} de ${n}</div></td>
  </tr></table>`;
}
function armarHojas(){
  const host = document.getElementById('impresion');
  const fuente = document.getElementById('contenido');
  if(!fuente || !fuente.querySelector('.portada')) return;
  host.innerHTML = ''; host.classList.add('midiendo');
  const hojas = []; let cuerpo, maxH;
  const nueva = () => {
    const h = document.createElement('div'); h.className = 'hoja';
    h.innerHTML = membreteHtml(0,0) + '<div class="cuerpo pg"></div><div class="pie"><span>Informe de Auditorías Internas a la Dirección · Documento confidencial</span><span class="pie-pag"></span></div>';
    host.appendChild(h); hojas.push(h); cuerpo = h.querySelector('.cuerpo');
    const alto = h.clientHeight, top = cuerpo.offsetTop;
    maxH = alto - top - 14*96/25.4;   // deja espacio para el pie
    cuerpo.style.height = maxH + 'px';
    return h;
  };
  const vacia = () => cuerpo.children.length === 0;
  // salta de hoja llevándose los títulos que quedarían solos al pie
  const saltar = () => {
    const colgantes = [];
    while(cuerpo.lastElementChild && (cuerpo.lastElementChild.tagName==='H2' || cuerpo.lastElementChild.classList.contains('h2sub'))){ colgantes.unshift(cuerpo.lastElementChild); cuerpo.lastElementChild.remove(); }
    nueva(); colgantes.forEach(c => cuerpo.appendChild(c));
  };
  const desborda = () => cuerpo.scrollHeight > maxH + 1;
  const secPag = {};
  // bloques en orden
  const bloques = [...fuente.children].map(n => n.cloneNode(true));
  nueva();
  for(let k=0; k<bloques.length; k++){
    const b = bloques[k];
    if(b.classList.contains('portada')){ if(!vacia()) nueva(); cuerpo.appendChild(b); if(k < bloques.length-1) nueva(); continue; }
    if(b.tagName==='H2'){
      if(b.classList.contains('sec-nueva') && !vacia()) nueva();
      // mantiene el título con su subtítulo y el inicio del contenido
      const sub = (bloques[k+1] && bloques[k+1].classList.contains('h2sub')) ? bloques[k+1] : null;
      cuerpo.appendChild(b); if(sub) cuerpo.appendChild(sub);
      const sig = bloques[k + (sub?2:1)];
      const divisible = sig && !sig.classList.contains('no-romper') && ((sig.querySelector('table.t') && sig.querySelector('table.t').tBodies[0] && sig.querySelector('table.t').tBodies[0].rows.length > 1) || sig.children.length > 1);
      const prueba = (sig && !divisible) ? sig.cloneNode(true) : Object.assign(document.createElement('div'), {style:'height:90px'});
      cuerpo.appendChild(prueba);
      const no = desborda(); prueba.remove();
      if(no && cuerpo.children.length > (sub?2:1)){ b.remove(); if(sub) sub.remove(); nueva(); cuerpo.appendChild(b); if(sub) cuerpo.appendChild(sub); }
      if(b.dataset.sec) secPag[b.dataset.sec] = hojas.length;
      if(sub) k++;
      continue;
    }
    cuerpo.appendChild(b);
    if(!desborda()) continue;
    // no cabe: dividir tablas por filas o tarjetas por elementos internos
    b.remove();
    const tabla = b.querySelector('table.t');
    let partes, armar;
    if(tabla && tabla.tBodies[0] && tabla.tBodies[0].rows.length > 1){
      partes = [...tabla.tBodies[0].rows];
      armar = () => { const c = b.cloneNode(true); c.querySelector('table.t').tBodies[0].innerHTML=''; return [c, c.querySelector('table.t').tBodies[0]]; };
    } else if(b.children.length > 1 && !b.classList.contains('no-romper')){
      partes = [...b.children];
      // la leyenda viaja pegada al primer elemento, para que no quede sola al pie de una hoja
      if(partes.length > 1 && partes[0].classList.contains('leyenda')){ const w = document.createElement('div'); w.append(partes[0], partes[1]); partes.splice(0, 2, w); }
      armar = () => { const c = b.cloneNode(false); return [c, c]; };
    } else {
      if(!vacia()) saltar(); cuerpo.appendChild(b); continue;
    }
    let [tarjeta, destino] = armar(); cuerpo.appendChild(tarjeta);
    for(const pz of partes){
      destino.appendChild(pz);
      if(desborda()){
        pz.remove();
        if(destino.children.length === 0){ tarjeta.remove(); saltar(); }
        else nueva();
        [tarjeta, destino] = armar(); cuerpo.appendChild(tarjeta); destino.appendChild(pz);
      }
    }
  }
  const n = hojas.length;
  hojas.forEach((h,i) => h.querySelectorAll('h2[data-sec]').forEach(t => { secPag[t.dataset.sec] = i+1; }));
  hojas.forEach((h,i) => { h.querySelector('.membrete').outerHTML = membreteHtml(i+1, n); });
  host.querySelectorAll('.indice-v li[data-sec]').forEach(li => { const pn = li.querySelector('.pn'); if(pn) pn.textContent = secPag[li.dataset.sec] || ''; });
  host.classList.remove('midiendo');
}
function imprimirInforme(){ armarHojas(); window.print(); }
window.addEventListener('beforeprint', armarHojas);

async function sha256(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function accesoGuardado(){ try { return sessionStorage.getItem('informeDirAcceso') === CLAVE_SHA256; } catch(e){ return false; } }
function pedirClave(){
  return new Promise(resolve => {
    const c = document.getElementById('contenido');
    c.innerHTML = `<div class="card" style="max-width:420px; margin:40px auto; text-align:center;">
      <div style="font-size:15px; font-weight:600; color:var(--navy); margin-bottom:6px;">Informe en borrador</div>
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 14px;">Este informe aún no ha sido aprobado. El acceso está restringido a Aseguramiento de Calidad hasta su aprobación.</p>
      <input id="clave" type="password" placeholder="Clave de acceso" style="width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font:inherit;">
      <button id="btn-clave" style="margin-top:10px; width:100%; padding:9px; border:0; border-radius:6px; background:var(--navy); color:#fff; font:inherit; cursor:pointer;">Ingresar</button>
      <div id="clave-err" style="color:var(--st-critical); font-size:12.5px; margin-top:8px; min-height:16px;"></div></div>`;
    const probar = async () => {
      const v = document.getElementById('clave').value.trim();
      if(await sha256(v) === CLAVE_SHA256){ try{ sessionStorage.setItem('informeDirAcceso', CLAVE_SHA256); }catch(e){} resolve(); }
      else document.getElementById('clave-err').textContent = 'Clave incorrecta.';
    };
    document.getElementById('btn-clave').onclick = probar;
    document.getElementById('clave').addEventListener('keydown', e => { if(e.key==='Enter') probar(); });
  });
}

(async function(){
  try{
    document.querySelectorAll('.m-estado').forEach(e=>{ e.textContent = ESTADO_INFORME==='APROBADO' ? 'Aprobado' : 'Borrador'; });
    if(ESTADO_INFORME!=='APROBADO'){
      document.body.classList.add('es-borrador');
      if(!accesoGuardado()) await pedirClave();
      document.getElementById('contenido').innerHTML = '<div class="estado-carga">Cargando datos de auditoría…</div>';
    }
    await cargar();
    const anios = [...new Set(AUD.map(a=>(a.fecha||'').slice(0,4)).filter(Boolean))].sort().reverse();
    const actual = String(new Date().getFullYear());
    const sel = document.getElementById('anio');
    const lista = anios.includes(actual) ? anios : [actual, ...anios];
    sel.innerHTML = lista.map(a=>`<option ${a===actual?'selected':''}>${a}</option>`).join('');
    sel.onchange = () => render(sel.value);
    render(sel.value);
  }catch(e){
    console.error(e);
    document.getElementById('contenido').innerHTML = '<div class="estado-carga">No se pudieron cargar los datos. Revisa tu conexión y vuelve a intentar.</div>';
  }
})();
</script>
