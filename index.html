<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro de Proveedores &#8212; Instituto Bioquímico Beta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#F0F4F8;color:#1a2332;font-size:14px}
.topbar{background:#1F4E79;color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.topbar h1{font-size:15px;font-weight:600}.topbar .sub{font-size:11px;opacity:.7;margin-top:2px}
.stats{display:flex;gap:20px}.st{text-align:center}.stv{font-size:18px;font-weight:700;line-height:1}.stl{font-size:10px;opacity:.7;margin-top:2px}
.fbar{background:#fff;border-bottom:1px solid #dde3ea;padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:57px;z-index:90}
.sw{position:relative;flex:1;min-width:240px}
.sw input{width:100%;padding:7px 12px 7px 34px;border:1.5px solid #c5d0dd;border-radius:7px;font-size:13px;outline:none}
.sw input:focus{border-color:#1F4E79}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:#8a9bb0;pointer-events:none}
select{padding:7px 9px;border:1.5px solid #c5d0dd;border-radius:7px;font-size:12px;background:#fff;outline:none;cursor:pointer;max-width:200px}
select:focus{border-color:#1F4E79}
.btnr{padding:7px 13px;background:#e8edf3;border:none;border-radius:7px;font-size:12px;cursor:pointer;color:#445566;font-weight:500}
.btnr:hover{background:#d0dae6}
.rc{font-size:12px;color:#667788;margin-left:auto;white-space:nowrap;align-self:center}
.main{padding:14px 24px;max-width:1440px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:#fff;border-radius:11px;border:1px solid #dde3ea;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .1s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.11);transform:translateY(-1px)}
.card.active{border-color:#1F4E79;box-shadow:0 0 0 2px rgba(31,78,121,.35)}
.ch{padding:11px 13px 9px;display:flex;align-items:flex-start;gap:9px;border-bottom:1px solid #f0f3f7}
.av{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;color:#fff}
.ci{flex:1;min-width:0}.ci h3{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ci .cs{font-size:11px;color:#6680a0;margin-top:2px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase}
.b-api{background:#E3F0FF;color:#1557A0}.b-mp{background:#E8F6EE;color:#1A6B3A}.b-mee{background:#FFF3E0;color:#B35A00}.b-srv{background:#F3E8FF;color:#6B2FA0}
.cb{padding:9px 13px}
.kv{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:12px;gap:8px}
.kv .k{color:#7a8ea0;flex-shrink:0}.kv .v{color:#1a2332;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%}
.pbar{height:5px;background:#e8edf3;border-radius:3px;margin:2px 0 7px}.pbf{height:100%;border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
.chip{display:inline-block;padding:2px 8px;background:#EEF4FF;color:#1F4E79;border-radius:20px;font-size:10px;font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.more{background:#f0f3f7;color:#667788}
.cf{padding:7px 13px;background:#f7f9fc;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f0f3f7;gap:6px}
.pcard{background:#fff;border-radius:11px;border:1px solid #dde3ea;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .1s}
.pcard:hover{box-shadow:0 4px 16px rgba(0,0,0,.11);transform:translateY(-1px)}
.pcard.active{border-color:#2E7D52;box-shadow:0 0 0 2px rgba(46,125,82,.35)}
.pcard-head{padding:12px 14px 10px;background:linear-gradient(135deg,#1A6B3A,#2E7D52);color:#fff}
.pcard-head h3{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:6px}
.pcard-head .pmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcard-body{padding:10px 14px}
.ins-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:12px}
.ins-row:last-child{border-bottom:none}
.ins-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-cal{background:#1A9A50}.dot-eva{background:#8B5CF6}
.ins-cod{font-family:monospace;color:#1557A0;font-size:11px;white-space:nowrap;flex-shrink:0}
.ins-desc{flex:1;color:#1a2332;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-prov{font-size:11px;color:#667788;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.pcard-foot{padding:7px 14px;background:#f7f9fc;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f0f3f7;gap:6px;font-size:12px}
.prog-wrap{flex:1;height:6px;background:#e8edf3;border-radius:3px;margin:0 8px}
.prog-fill{height:100%;border-radius:3px;background:#1A9A50}
.pill{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.pvig{background:#D1F0DC;color:#1A6B3A}.pvenc{background:#E5484D;color:#fff;font-weight:700}
.ppv{background:#FFECB0;color:#8A5500}.pprox{background:#FFF8D0;color:#7A5000}
.ppend{background:#FFC934;color:#5C4300;font-weight:700}.pcal{background:#E3F0FF;color:#1557A0}.peval{background:#F3E8FF;color:#6B2FA0}
.ev-validado{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(255,255,255,.25);color:#fff;border:1px solid rgba(255,255,255,.5)}
.ev-revalidar{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#FFF0C0;color:#7D5800}
.ev-porvalidar{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#F3E8FF;color:#6B2FA0}
/* TARJETA PROVEEDOR */
.tcard{background:#fff;border-radius:11px;border:1px solid #dde3ea;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .1s}
.tcard:hover{box-shadow:0 4px 16px rgba(0,0,0,.11);transform:translateY(-1px)}
.tcard.active{border-color:#1F4E79;box-shadow:0 0 0 2px rgba(31,78,121,.35)}
.tcard-head{background:#1F4E79;color:#fff;padding:14px 16px}
.tcard-head .logo-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tcard-head .inst{font-size:10px;opacity:.8;line-height:1.4}
.tcard-head .title{font-size:13px;font-weight:700;letter-spacing:.5px;text-align:center;flex:1}
.tcard-body{padding:0}
.trow{display:grid;grid-template-columns:130px 1fr;border-bottom:1px solid #eef1f5;font-size:12px}
.trow:last-child{border-bottom:none}
.trow.span2{grid-template-columns:130px 1fr 130px 1fr}
.tlbl{background:#f0f4f8;padding:7px 10px;font-weight:600;color:#1F4E79;font-size:11px;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center}
.tval{padding:7px 10px;color:#1a2332;word-break:break-word;line-height:1.4}
.tsec{background:#1F4E79;color:#fff;padding:6px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:center;grid-column:1/-1}
.tcard-foot{background:#f7f9fc;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid #eef1f5}
/* PANEL */
.panel{position:fixed;right:0;top:0;height:100vh;width:560px;background:#fff;box-shadow:-4px 0 28px rgba(0,0,0,.16);z-index:200;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:translateX(0)}
.ph{background:#1F4E79;color:#fff;padding:15px 20px;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.ph.green{background:linear-gradient(135deg,#1A6B3A,#2E7D52)}
.ph h2{font-size:15px;font-weight:600;line-height:1.3;padding-right:10px}.ph .psub{font-size:11px;opacity:.72;margin-top:3px}
.bx{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;opacity:.8;padding:0;flex-shrink:0}
.bx:hover{opacity:1}.pbody{flex:1;overflow-y:auto;padding:18px 20px}
.psec{margin-bottom:20px}
.ptitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#7a8ea0;margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid #eef1f5}
.fgrid{display:grid;grid-template-columns:140px 1fr;gap:5px 10px;font-size:13px}
.fl{color:#7a8ea0;align-self:start;padding-top:1px}.fv{color:#1a2332;word-break:break-word}
.prod-block{border:1px solid #e8edf3;border-radius:9px;overflow:hidden;margin-bottom:10px}
.prod-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f7f9fc;border-bottom:1px solid #e8edf3}
.prod-nombre{font-size:13px;font-weight:600;color:#1a2332}
.ins-table{width:100%;border-collapse:collapse;font-size:12px}
.ins-table th{background:#eef1f5;text-align:left;padding:5px 8px;font-weight:600;color:#556677;font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.ins-table td{padding:5px 8px;border-bottom:1px solid #f0f3f7;vertical-align:top;line-height:1.4}
.ins-table tr:last-child td{border-bottom:none}
.ins-cod{font-family:monospace;color:#1557A0;font-size:11px;white-space:nowrap}
.ins-cal{color:#1A6B3A;font-size:11px;font-weight:600}.ins-eva{color:#8B5CF6;font-size:11px;font-weight:600}
.mat-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.mat-table th{background:#f0f4f8;text-align:left;padding:5px 8px;font-weight:600;color:#556677;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.mat-table td{padding:5px 8px;border-bottom:1px solid #f0f3f7;vertical-align:top;line-height:1.4}
.mat-table tr:last-child td{border-bottom:none}
.cod{font-family:monospace;color:#1557A0;font-size:11px;white-space:nowrap}
.bpdf{display:flex;align-items:center;gap:8px;width:100%;padding:10px 16px;background:#1F4E79;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;justify-content:center;transition:background .15s;margin-top:4px}
.bpdf:hover{background:#163d62}.bpdf.sec{background:#fff;color:#1F4E79;border:1.5px solid #c5d0dd;margin-top:8px}
.bpdf.sec:hover{background:#f0f4f8}
.cert-ok{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;font-size:12px;margin-top:8px;background:#E8F6EE;color:#1A6B3A;border:1px solid #b8e0c8}
.cert-no{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;font-size:12px;margin-top:8px;background:#f7f9fc;color:#8a9bb0;border:1px solid #dde3ea}

.fab-grupo{margin-top:8px;border:1px solid #e8edf3;border-radius:8px;overflow:hidden}
.fab-grupo-title{background:#f0f4f8;padding:5px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#556677;border-bottom:1px solid #e8edf3}
.fab-row{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid #f5f5f5;font-size:12px}
.fab-row:last-child{border-bottom:none}
.fab-nombre{flex:1;color:#1a2332;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab-cert{font-family:monospace;color:#1557A0;font-size:10px;white-space:nowrap}

/* CALENDARIO */

.cal-kpi-bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.cal-kpi{background:#fff;border-radius:11px;border:1px solid #dde3ea;padding:14px 20px;flex:1;min-width:160px;text-align:center}
.cal-kpi-val{font-size:28px;font-weight:700;line-height:1;margin-bottom:4px}
.cal-kpi-lbl{font-size:11px;color:#7a8ea0;text-transform:uppercase;letter-spacing:.5px}
.cal-progress-wrap{background:#fff;border-radius:11px;border:1px solid #dde3ea;padding:16px 20px;margin-bottom:20px}
.cal-progress-title{font-size:13px;font-weight:700;color:#1F4E79;margin-bottom:12px}
.cal-progress-bar{height:28px;background:#e8edf3;border-radius:8px;overflow:hidden;position:relative;margin-bottom:6px}
.cal-progress-fill{height:100%;border-radius:8px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:10px}
.cal-progress-pct{font-size:13px;font-weight:700;color:#fff}
.cal-progress-meta{display:flex;justify-content:space-between;font-size:11px;color:#8a9bb0}
.cal-wrap{padding:14px 24px;max-width:1440px;margin:0 auto}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cal-header h2{font-size:18px;font-weight:700;color:#1F4E79}
.cal-semestre{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.cal-mes{background:#fff;border-radius:11px;border:1px solid #dde3ea;overflow:hidden}
.cal-mes-header{background:#1F4E79;color:#fff;padding:10px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.cal-mes-header .mes-count{background:rgba(255,255,255,.2);border-radius:20px;padding:2px 8px;font-size:11px}
.cal-mes-body{padding:8px}
.cal-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;margin-bottom:5px;cursor:pointer;transition:background .15s;border:1px solid #eef1f5}
.cal-item:last-child{margin-bottom:0}
.cal-item:hover{background:#f0f4f8;border-color:#c5d0dd}
.cal-item.cal-realizada{border-left:3px solid #1A9A50;background:#F0FAF4}
.cal-item.cal-programada{border-left:3px solid #2E74B5;background:#EEF4FF}
.cal-item.cal-pendiente{border-left:3px solid #F5A623;background:#FFF8EE}
.cal-obs{font-size:10px;color:#8A5500;background:#FFF3D6;border:1px solid #F0DBA0;border-radius:10px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;flex-shrink:0}
.cal-nprov{font-size:10px;font-family:monospace;color:#1557A0;background:#E3F0FF;padding:1px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.cal-nombre{flex:1;font-size:12px;font-weight:600;color:#1a2332;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-dia{font-size:11px;color:#8a9bb0;white-space:nowrap;flex-shrink:0}
.cal-estado{font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.cal-estado.r{background:#D1F0DC;color:#1A6B3A}
.cal-estado.p{background:#E3F0FF;color:#1557A0}
.cal-estado.pd{background:#FFF0C0;color:#7D5800}
.cal-semestre-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#445566;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #dde3ea}
.cal-empty{text-align:center;padding:20px;color:#aab8c5;font-size:12px}
.cal-leyenda{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.cal-ley-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#556677}
.cal-ley-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
@media(max-width:900px){.cal-semestre{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.cal-semestre{grid-template-columns:1fr}}
.pdf-icon{font-size:10px;background:#1A9A50;color:#fff;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:150;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:all}
.empty{text-align:center;padding:60px 20px;color:#8a9bb0;grid-column:1/-1}
/* Modo tarjeta: grid de 2 columnas */
.grid.tarjeta-mode{grid-template-columns:repeat(auto-fill,minmax(500px,1fr))}
@media(max-width:600px){.stats{display:none}.panel{width:100%}.main{padding:10px 12px}.grid{grid-template-columns:1fr}.grid.tarjeta-mode{grid-template-columns:1fr}}

#loadOverlay{position:fixed;inset:0;background:#F0F4F8;z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.spinner{width:34px;height:34px;border:3px solid #c5d0dd;border-top-color:#1F4E79;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#errBanner{display:none;background:#FFD7D7;color:#9C1515;padding:9px 24px;font-size:12.5px;text-align:center}
.syncbar{display:flex;align-items:center;gap:10px;font-size:11px;opacity:.85}
.syncbar button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}
.syncbar button:hover{background:rgba(255,255,255,.28)}
.syncbar button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>&#127981; Registro de Proveedores Calificados</h1>
  <div class="sub">Instituto Bioquímico Beta S.A. &#8212; Aseguramiento de Calidad &#183; PL-QA-019</div></div>
<div id="errBanner"></div>
  <div class="stats">
    <div class="st"><div class="stv" id="stT">&#8212;</div><div class="stl" id="stTL">Proveedores</div></div>
    <div class="st"><div class="stv" id="stC" style="color:#7FD8A0">&#8212;</div><div class="stl" id="stCL">Calificados</div></div>
    <div class="st"><div class="stv" id="stV" style="color:#FF9999">&#8212;</div><div class="stl">Vencidos</div></div>
    <div class="st"><div class="stv" id="stP" style="color:#FFD060">&#8212;</div><div class="stl" id="stPL">Por vencer</div></div>
  </div>
  <div class="syncbar"><span id="syncStatus">Cargando datos&#8230;</span><button id="btnRefresh" onclick="loadAllData()">&#128260; Actualizar</button></div>
</div>
<div class="fbar">
  <div class="sw"><span class="si">&#128269;</span>
  <input id="q" type="text" placeholder="Buscar por proveedor, codigo, descripcion, N certificado..." autocomplete="off"></div>
  <select id="fVista" onchange="render()">
    <option value="prov">Vista Proveedores</option>
    <option value="prod">Vista Productos</option>
    <option value="tarjeta">Tarjeta de Proveedor</option>
    <option value="calendario">Calendario Auditorias 2026</option>
  </select>
  <select id="fProd"><option value="">Todos los productos</option></select>
  <select id="fTipo"><option value="">Todos los tipos</option><option>API</option><option>MP</option><option>MEE</option><option value="SERV.">SERV.</option></select>
  <select id="fCli"><option value="">Todos los clientes</option></select>
  <select id="fEst"><option value="">Todos los estatus</option><option>Calificado</option><option>Por Evaluar</option></select>
  <select id="fAl"><option value="">Todas las alertas</option>
    <option value="Vigente">Vigente</option><option value="Por vencer">Por vencer</option>
    <option value="Proximo">Proximo</option><option value="Vencido">Vencido</option><option value="Pendiente">Pendiente</option></select>
  <button class="btnr" onclick="resetF()">Limpiar</button>
  <span class="rc" id="rc"></span>
</div>
<div id="loadOverlay"><div class="spinner"></div><div style="color:#445566;font-size:13px;font-weight:600">Cargando datos desde Google Sheets&#8230;</div></div>
<div class="main"><div class="grid" id="grid"></div></div>
<div class="overlay" id="ov" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="ph" id="panelHdr"><div><h2 id="pT">&#8212;</h2><div class="psub" id="pS">&#8212;</div></div>
  <button class="bx" onclick="closePanel()">&#10005;</button></div>
  <div class="pbody" id="pB"></div>

/* ---- csv_parser.js ---- */
/**
 * Parser CSV estilo RFC4180 — soporta:
 *  - campos entre comillas dobles con comas internas
 *  - campos entre comillas dobles con saltos de línea internos (multi-línea real)
 *  - comillas dobles escapadas como "" dentro de un campo entrecomillado
 *  - CRLF y LF
 * Devuelve un array de objetos usando la primera fila como encabezado.
 */
function parseCSV(text) {
  // Normaliza CRLF -> LF para simplificar, pero esto es seguro porque
  // los saltos de línea "reales" dentro de campos entrecomillados también
  // se normalizan igual (no rompe nada).
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  let i = 0;
  const n = text.length;

  while (i < n) {
    const c = text[i];

    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') {
          field += '"';
          i += 2;
          continue;
        } else {
          inQuotes = false;
          i++;
          continue;
        }
      } else {
        field += c;
        i++;
        continue;
      }
    } else {
      if (c === '"') {
        inQuotes = true;
        i++;
        continue;
      }
      if (c === ',') {
        row.push(field);
        field = '';
        i++;
        continue;
      }
      if (c === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
        i++;
        continue;
      }
      field += c;
      i++;
      continue;
    }
  }
  // último campo/fila pendiente
  if (field.length > 0 || row.length > 0) {
    row.push(field);
    rows.push(row);
  }

  // quita filas totalmente vacías (líneas en blanco al final del CSV)
  const cleanRows = rows.filter(r => !(r.length === 1 && r[0].trim() === ''));

  if (cleanRows.length === 0) return [];

  const headers = cleanRows[0].map(h => h.trim());
  const out = [];
  for (let r = 1; r < cleanRows.length; r++) {
    const rawRow = cleanRows[r];
    // salta filas vacías intermedias
    if (rawRow.every(v => v.trim() === '')) continue;
    const obj = {};
    for (let c = 0; c < headers.length; c++) {
      obj[headers[c]] = (rawRow[c] !== undefined ? rawRow[c] : '').trim();
    }
    out.push(obj);
  }
  return out;
}

/* ---- clean_helpers.js ---- */
/**
 * Utilidades de limpieza de datos venidos de Google Sheets, para que calcen
 * con lo que espera el código de render ya existente en el panel (funciones
 * apill(), pctColor(), etc.).
 */

// Quita símbolos/íconos al inicio de un valor de ALERTA ("✓ Vigente" -> "Vigente",
// "— Pendiente" -> "Pendiente") dejando solo la palabra de estado que
// apill() usa para decidir el color de la pastilla.
function cleanAlerta(raw) {
  if (!raw) return '';
  return raw
    .replace(/^[\s✓✔️❌✗⚠️—\-•·]+/u, '') // símbolos/guiones/checks al inicio
    .trim();
}

// Convierte "96,7%" -> 96.7 (number). "0,0%" o "" -> null (sin dato).
function cleanPercent(raw) {
  if (raw === undefined || raw === null) return null;
  const s = String(raw).trim();
  if (s === '') return null;
  const normalized = s.replace('%', '').replace(',', '.').trim();
  const num = parseFloat(normalized);
  if (isNaN(num)) return null;
  if (num === 0) return null; // "0,0%" se trata como "sin porcentaje"
  return num;
}

// Detecta fechas artefacto del bug de época de hojas de cálculo
// (30/12/1899 o 30/12/1904 según el sistema de fechas de la planilla)
// que en realidad representan una celda vacía/cero, y las convierte en ''.
const EPOCH_BUG_DATES = new Set(['30/12/1899', '30/12/1904', '31/12/1899', '31/12/1904']);
function cleanDate(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  if (EPOCH_BUG_DATES.has(s)) return '';
  return s;
}

// Divide un campo multi-línea (p.ej. CONTACTO con 2 nombres, o
// CERTIFICACIÓN ISO 9001 con 2 certificados) en un array de líneas no vacías.
function splitLines(raw) {
  if (!raw) return [];
  return String(raw)
    .split('\n')
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

/* ---- map_base_datos.js ---- */
/**
 * Mapea las filas "planas" (una fila por material) de la hoja BASE_DATOS_COD
 * a un array de objetos "proveedor" agrupados por N° PROVEEDOR, con la forma
 * que espera el código de render existente (equivalente a la variable RAW).
 *
 * Nota: los campos que vienen de la hoja "N° PROV." (ficha de proveedor) —
 * razon_social, rubro, contacto, direccion, telefono, correo,
 * certificaciones, vig_cert, prod_asociados — y los que vienen de la hoja
 * PRODUCTOS — productos, productos_detalle — se agregan después con las
 * funciones de merge correspondientes (map_ficha.js / map_productos.js).
 * drive_id tampoco se calcula aquí: eso lo sigue haciendo init() en el HTML
 * final, igual que en el código original, usando el DRIVE_IDS estático.
 */

// "96,7%" -> "96.7%" ; "0,0%" o vacío -> "" (para calzar con el string que
// usa el código original, p.ej. RAW real: pct:"96.7%" o pct:"" cuando no hay dato)
function cleanPercentStr(raw) {
  if (raw === undefined || raw === null) return '';
  const s = String(raw).trim();
  if (s === '') return '';
  const normalized = s.replace(',', '.');
  const num = parseFloat(normalized.replace('%', ''));
  if (isNaN(num) || num === 0) return '';
  return normalized.endsWith('%') ? normalized : normalized + '%';
}

// Busca una clave de encabezado que contenga cierto texto, ignorando
// espacios/saltos de línea extra (para columnas como "VIGENCIA HASTA:\n(Cert. Fabricante)").
function findKeyLike(row, substring) {
  const keys = Object.keys(row);
  const found = keys.find(k => k.replace(/\s+/g, ' ').trim().includes(substring));
  return found ? row[found] : '';
}

// Busca la columna del link/ID de Drive del certificado (agregada 2026-08-18
// para que el PDF se pueda cargar en vivo desde la hoja, sin depender de
// DRIVE_IDS hardcodeado). Nombre recomendado de la columna en la hoja:
// "Link Certificado (Drive)" — pero se acepta cualquier variante razonable,
// sin importar mayúsculas/acentos, para no depender de que el texto calce
// exacto (mismo problema que tuvimos con "N° PROVEEDOR").
function findDriveLinkCol(row) {
  const wanted = ['LINK CERTIFICADO', 'CERTIFICADO DRIVE', 'ID DRIVE', 'DRIVE PDF', 'LINK PDF'];
  const keys = Object.keys(row);
  for (const k of keys) {
    const norm = k.replace(/\s+/g, ' ').trim().toUpperCase();
    if (wanted.some(w => norm.indexOf(w) !== -1)) return row[k];
  }
  return '';
}

// Acepta tanto un link completo de Drive ("https://drive.google.com/file/d/ID/view?...",
// ".../open?id=ID") como el ID pelado, y devuelve solo el ID. Si no reconoce
// el formato, devuelve '' (así se cae de vuelta al DRIVE_IDS estático).
function extractDriveId(v) {
  if (!v) return '';
  v = String(v).trim();
  if (!v) return '';
  if (/^[a-zA-Z0-9_-]{15,}$/.test(v)) return v; // ya es un ID
  const m = v.match(/\/d\/([a-zA-Z0-9_-]{15,})/) || v.match(/[?&]id=([a-zA-Z0-9_-]{15,})/);
  return m ? m[1] : '';
}

function buildProvidersFromBaseDatos(rows) {
  const byProv = new Map();

  for (const r of rows) {
    const n_prov = (r['N° PROVEEDOR'] || '').trim();

    if (!byProv.has(n_prov)) {
      byProv.set(n_prov, {
        n_prov,
        proveedor: (r['PROVEEDOR'] || '').trim(),
        tipo: (r['TIPO SUMINISTRO'] || '').trim(),
        importancia: (r['IMPORTANCIA'] || '').trim(),

        fecha_prox: cleanDate(r['PRÓXIMA RECALIFICACIÓN']),
        frecuencia: (r['FRECUENCIA'] || '').trim(),
        cod_reporte: (r['Cód. Reporte de Auditoría a proveedor'] || '').trim(),
        n_cert: (r['N° Certificado de Calificación'] || '').trim(),
        link_certificado: (findDriveLinkCol(r) || '').trim(),
        n_cert_fab: (r['N° CERTIFICADO FABRICANTE'] || '').trim(),
        vig_fab: cleanDate(findKeyLike(r, 'VIGENCIA HASTA')),
        obs: (r['OBSERVACIONES'] || '').replace(/\n/g, ' ').trim() || 'Sin obs.',
        clientes: [],
        materiales: [],
      });
    }

    const p = byProv.get(n_prov);
    const cliente = (r['DESTINO/CLIENTE'] || '').trim();
    if (cliente && !p.clientes.includes(cliente)) p.clientes.push(cliente);

    const codigo_mat = (r['CÓDIGO'] || '').trim();
    const descripcion = (r['DESCRIPCIÓN DEL MATERIAL/SERVICIO SUMINISTRADO'] || '').trim();
    const fabricante = (r['FABRICANTE'] || '').trim();
    if (codigo_mat || descripcion) {
      p.materiales.push({ codigo_mat, descripcion, fabricante, cliente });
    }
  }

  return Array.from(byProv.values());
}

/* ---- map_ficha.js ---- */
/**
 * Mapea filas de la hoja "N° PROV." (ficha de proveedor) y las fusiona
 * dentro de los objetos "proveedor" ya armados desde BASE_DATOS_COD
 * (ver map_base_datos.js), agregando: razon_social, rubro, contacto,
 * direccion, telefono, correo, certificaciones, vig_cert, prod_asociados.
 *
 * Reglas de transformación descubiertas comparando contra los datos reales
 * que hoy están hardcodeados en el panel (P01 a P05):
 *  - Campos multi-línea (CONTACTO, CORREO, CERTIFICACIÓNISO 9001,
 *    PRODUCTOS ASOCIADOS) se unen con " / " tal cual, sin recortar cada
 *    línea individualmente (para no perder espacios internos como en
 *    "ISO 9001-2015 /  (vigente 01-2024)").
 *  - VIGENCIA HASTA viene como "abr-24" (mes abreviado-año) y se convierte
 *    al mismo formato que usa el resto del panel: "01/04/2024".
 *  - prod_asociados usa PRODUCTOS ASOCIADOS si tiene contenido; si esa
 *    columna viene vacía, se usa RESUMEN como respaldo (así es como se ve
 *    hoy en los datos reales de P01 y P02).
 */

const MESES_ABR = {
  ene: '01', feb: '02', mar: '03', abr: '04', may: '05', jun: '06',
  jul: '07', ago: '08', sep: '09', oct: '10', nov: '11', dic: '12',
};

// Une líneas de un campo multi-línea con " / ", SIN recortar cada línea
// (solo descarta líneas totalmente vacías).
function joinLines(raw) {
  if (!raw) return '';
  return String(raw).split('\n').filter(l => l !== '').join(' / ');
}

// "abr-24" -> "01/04/2024" ; "abr-26" -> "01/04/2026" ; vacío -> ''
function parseMesAno(raw) {
  if (!raw) return '';
  const s = String(raw).trim().toLowerCase();
  const m = s.match(/^([a-záéíóú]{3})-(\d{2})$/i);
  if (!m) return '';
  const mesNum = MESES_ABR[m[1]];
  if (!mesNum) return '';
  const anio = '20' + m[2];
  return '01/' + mesNum + '/' + anio;
}

function buildFichaByNProv(rows) {
  const byProv = new Map();
  for (const r of rows) {
    const n_prov = (r['ID'] || '').trim();
    if (!n_prov) continue;
    byProv.set(n_prov, {
      razon_social: (r['PROVEEDORES'] || '').trim(),
      rubro: (r['RUBRO'] || '').trim(),
      contacto: joinLines(r['CONTACTO']),
      direccion: (r['DIRECCIÓN'] || '').trim(),
      telefono: (r['TELÉFONO'] || '').trim(),
      correo: joinLines(r['CORREO']),
      certificaciones: joinLines(findKeyLike(r, 'CERTIFICACIÓNISO') || r['CERTIFICACIÓNISO 9001']),
      vig_cert: parseMesAno(findKeyLike(r, 'VIGENCIA HASTA')),
      prod_asociados: joinLines(r['PRODUCTOS ASOCIADOS']) || (r['RESUMEN'] || '').trim(),
    });
  }
  return byProv;
}

// Fusiona los datos de ficha dentro del array de proveedores (de map_base_datos.js).
function mergeFichaIntoProviders(providers, fichaByNProv) {
  return providers.map(p => {
    const f = fichaByNProv.get(p.n_prov);
    if (!f) return p;
    return Object.assign({}, p, f);
  });
}

/**
 * Mapea las filas de la hoja PRODUCTOS (una fila por insumo/producto) a:

// "Interpharma S.A. (IPhSA)" -> "IPHSA" (usa la abreviación entre paréntesis

function extractClienteAbbrev(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  const m = s.match(/\(([^)]+)\)\s*$/);
  if (m) return m[1].trim().toUpperCase();
  return s;
}

function buildProductosDet(rows) {
  const byNombre = new Map();

  for (const r of rows) {
    const nombre = (r['PRODUCTO'] || '').trim();
    if (!nombre) continue;

    if (!byNombre.has(nombre)) {
      byNombre.set(nombre, {
        nombre,
        estado_val: (r['ESTADO ¿VALIDADO?'] || '').trim() || 'Por Validar',
        cliente: extractClienteAbbrev(r['CLIENTE']),
        rep_val: (findKeyLike(r, 'VAL. PRODUCTO') || '').trim(),
        fecha_val: (r['FECHA VALIDACIÓN'] || '').trim(),
        insumos: [],
      });
    }

    const p = byNombre.get(nombre);
    const codigo = (r['CÓDIGO'] || '').trim();
    if (!codigo) continue; // fila sin insumo real
    p.insumos.push({
      codigo,
      desc: (r['DESCRIPCIÓN'] || '').trim(),
      n_p: (r['N°P'] || '').trim(),
      proveedor: (r['PROVEEDOR'] || '').trim(),
      fabricante: (r['FABRICANTE'] || '').trim(),
      status_prov: (r['STATUS PROVEEDOR'] || '').trim(),
      // Los saltos de línea reales dentro de OBSERVACIONES se reemplazan por
      // un espacio simple (a diferencia de CONTACTO/CORREO/CERTIFICACIÓN en
      // la ficha de proveedor, que se unen con " / ") — así es como se ve
      // hoy el texto ya publicado en producción.
      obs: (r['OBSERVACIONES'] || '').replace(/\n/g, ' ').trim() || 'Sin obs.',
    });
  }

  // total_ins / cal_ins se calculan, no se leen de una columna.
  const PD = Array.from(byNombre.values()).map(p => ({
    ...p,
    total_ins: p.insumos.length,
    cal_ins: p.insumos.filter(i => i.status_prov === 'Calificado').length,
  }));

  const PA = PD.map(p => p.nombre).sort();

  return { PD, PA };
}

// Para cada proveedor (n_prov), calcula:
//   productos: nombres de los productos que usan algún insumo de ese proveedor
//   productos_detalle: mismos productos, pero solo con SUS insumos (los de ese proveedor)
function mergeProductosIntoProviders(providers, PD) {
  return providers.map(p => {
    const productos = [];
    const productos_detalle = [];
    for (const prod of PD) {
      const misInsumos = prod.insumos.filter(i => i.n_p === p.n_prov);
      if (misInsumos.length > 0) {
        productos.push(prod.nombre);
        productos_detalle.push({
          nombre: prod.nombre,
          estado_val: prod.estado_val,
          insumos: misInsumos.map(i => ({
            codigo: i.codigo, desc: i.desc, fabricante: i.fabricante,
            status_prov: i.status_prov, n_p: i.n_p, proveedor: i.proveedor,
          })),
        });
      }
    }
    return Object.assign({}, p, { productos, productos_detalle });
  });
}

/* ---- map_calendario.js ---- */
/**
 * Mapea las filas de la hoja Seguimiento_AUD-PROV (una fila por auditoría
 * programada) al array PROGRAMA_AUD que usa renderCalendario() en el panel.
 *
 * Estructura de columnas (definida junto con la planilla
 * "Seguimiento_AUD-PROV_2026.xlsx" generada a partir del programa anual de
 * auditorías real): N° PROVEEDOR, PROVEEDOR, TIPO SUMINISTRO,
 * MES PROGRAMADO, DÍA PROGRAMADO, Auditor, Fecha_RECALIFICACIÓN, ESTATUS,
 * % CALIFICACIÓN, Tipo Clasificación, Cód. Reporte de Auditoría a
 * proveedor, N° Certificado de Calificación, Fecha Termino Reporte,
 * Estado hoy.
 *
 * Las columnas MES PROGRAMADO / DÍA PROGRAMADO se agregaron a propósito
 * (además de la columna de texto Fecha_RECALIFICACIÓN, que es solo para
 * lectura humana) para que este mapeo no tenga que interpretar fechas de
 * texto ambiguas ("Por definir", "Junio 2026", etc.).
 *
 * Columna Observación (agregada 2026-08-18): texto libre opcional
 * (ej. "Finalizado", "Pendiente Reporte"). Se muestra en el calendario
 * junto al estado cuando viene con contenido.
 *
 * pickCol(): lee una columna probando varios nombres de encabezado
 * alternativos. Se agregó porque en la hoja real el encabezado de
 * "N° PROVEEDOR" a veces se guarda/exporta sin la "N" ("° PROVEEDOR"),
 * lo que antes hacía que TODAS las filas se descartaran en silencio
 * (nprov quedaba vacío) y el calendario se viera vacío sin ningún error.
 */
function pickCol(r, names) {
  for (const n of names) {
    if (r[n] !== undefined && r[n] !== null && String(r[n]).trim() !== '') return r[n];
  }
  return '';
}
function buildProgramaAud(rows) {
  return rows
    .map(r => {
      const nprov = pickCol(r, ['N° PROVEEDOR', 'Nº PROVEEDOR', '° PROVEEDOR', 'N PROVEEDOR', 'PROVEEDOR N°']).toString().trim();
      const nombre = (r['PROVEEDOR'] || '').trim();
      const mes = parseInt(r['MES PROGRAMADO'], 10);
      const diaRaw = (r['DÍA PROGRAMADO'] !== undefined && r['DÍA PROGRAMADO'] !== null) ? String(r['DÍA PROGRAMADO']).trim() : '';
      const dia = /^\d+$/.test(diaRaw) ? parseInt(diaRaw, 10) : 0; // "Por definir" o vacío -> 0
      const estado = (r['Estado hoy'] || '').trim() || 'Pendiente';
      const observacion = (r['Observación'] || r['Observaciones'] || '').trim();
      if (!nprov || !nombre || isNaN(mes)) return null;
      return { nombre, nprov, mes, dia, estado, observacion };
    })
    .filter(Boolean);
}


function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Normaliza may\u00fasculas/acentos para que "VENCIDO", "Vencido" o "vencido"
// (inconsistencias reales en la planilla origen) siempre calcen igual,
// tanto para el color de la pastilla como para los contadores del header.
function normAlerta(a){
  var s=(a||'').toString().trim();
  return s.normalize?s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase():s.toLowerCase();
}
// La columna ALERTA no siempre trae la palabra "Por vencer": para las
// recalificaciones próximas, la fórmula de origen escribe un conteo de
// días (p.ej. "⚡ 3 días", "⚡ 13 días"). Lo tratamos como "por vencer"
// tanto para el color de la pastilla como para el contador del header,
// sin perder el detalle de cuántos días quedan en el texto mostrado.
function esAlertaDias(a){
  return /\d+\s*d[ií]as?/i.test((a||'').toString());
}
function apill(a){
  var n=normAlerta(a);
  if(n.indexOf('vigente')===0)return 'pvig';
  if(n.indexOf('vencido')===0)return 'pvenc';
  if(n.indexOf('por vencer')===0)return 'ppv';
  if(n.indexOf('proximo')===0)return 'pprox';
  if(esAlertaDias(a))return 'ppv';
  return 'ppend'; // incluye "Pendiente" y cualquier otro valor sin match
}
function esPorVencer(a){
  var n=normAlerta(a);
  return n.indexOf('por vencer')===0||esAlertaDias(a);
}
function pctColor(v){if(!v)return '#c5d0dd';var n=parseFloat(v);if(n>=90)return '#1A9A50';if(n>=70)return '#F5A623';return '#E24B4A';}
function getDriveId(np,nc){return (DRIVE_IDS&&(DRIVE_IDS[np+'|'+nc]||DRIVE_IDS[np+'|'+np]))||'';}

function init(){
  PROVS=RAW.map(function(p){
    // Prioridad: link/ID en vivo desde la hoja (columna nueva) > DRIVE_IDS
    // estático (respaldo, para proveedores que aún no tienen la columna
    // completada).
    p.drive_id=extractDriveId(p.link_certificado)||DRIVE_IDS[p.n_prov+'|'+p.proveedor]||DRIVE_IDS[p.n_prov+'|'+p.n_cert]||'';
    p._idx=[p.n_prov,p.proveedor,p.n_cert,p.cod_reporte,p.razon_social||'',p.rubro||'',p.contacto||'',p.correo||'']
      .concat(p.produtos||p.productos||[])
      .concat((p.materiales||[]).map(function(m){return (m.codigo_mat||'')+' '+(m.descripcion||'')+' '+(m.fabricante||'');}))
      .join(' ').toLowerCase();
    return p;
  });
  PD=PRODS_DET.map(function(p){
    p._idx=[p.nombre,p.cliente||'',p.rep_val||'']
      .concat((p.insumos||[]).map(function(i){return (i.codigo||'')+' '+(i.desc||'')+' '+(i.proveedor||'');}))
      .join(' ').toLowerCase();
    return p;
  });
  PA=PRODS_ALL.slice();
  var sp=document.getElementById('fProd');
  PA.forEach(function(pr){var o=document.createElement('option');o.value=o.textContent=pr;sp.appendChild(o);});
  var clis=[];
  PROVS.forEach(function(p){(p.clientes||[]).forEach(function(c){if(c&&clis.indexOf(c)===-1)clis.push(c);});});
  clis.sort();
  var sc=document.getElementById('fCli');
  clis.forEach(function(c){var o=document.createElement('option');o.value=o.textContent=c;sc.appendChild(o);});
  render();
}

function filterList(){
  var q=document.getElementById('q').value.toLowerCase().trim();
  var tipo=document.getElementById('fTipo').value;
  var cli=document.getElementById('fCli').value;
  var est=document.getElementById('fEst').value;
  var al=document.getElementById('fAl').value;
  var list=PROVS.map(function(p,i){return {p:p,i:i};});
  if(q){var ts=q.split(' ').filter(Boolean);list=list.filter(function(x){return ts.every(function(t){return x.p._idx.indexOf(t)!==-1;});});}
  if(tipo)list=list.filter(function(x){return x.p.tipo===tipo;});
  if(cli)list=list.filter(function(x){return (x.p.clientes||[]).indexOf(cli)!==-1;});
  if(est)list=list.filter(function(x){return x.p.estatus===est;});
  if(al)list=list.filter(function(x){if(normAlerta(al)==='por vencer')return esPorVencer(x.p.alerta);return normAlerta(x.p.alerta).indexOf(normAlerta(al))!==-1;});
  return list;
}

function render(){
  var vista=document.getElementById('fVista').value;
  var prod=document.getElementById('fProd').value;
  var grid=document.getElementById('grid');

  /* ── Vista Calendario ── */
  if(vista==='calendario'){
    activeMode='calendario';
    renderCalendario();
    return;
  }

  /* ── Vista Productos ── */
  if(vista==='prod'||prod){
    document.getElementById('fVista').value='prod';
    activeMode='prod';
    grid.className='grid';
    var list=PD.filter(function(p){return !prod||p.nombre===prod;});
    var q=document.getElementById('q').value.toLowerCase().trim();
    if(q){var ts=q.split(' ').filter(Boolean);list=list.filter(function(x){return ts.every(function(t){return x._idx.indexOf(t)!==-1;});});}
    grid.innerHTML=list.length===0?'<div class="empty"><div style="font-size:44px">&#128270;</div><p>Sin resultados</p></div>':list.map(function(p){return renderProdCard(p,PD.indexOf(p));}).join('');
    document.getElementById('stTL').textContent='Productos';document.getElementById('stCL').textContent='Insumos cal.';
    document.getElementById('stT').textContent=list.length;
    document.getElementById('stC').textContent=list.reduce(function(a,p){return a+(p.cal_ins||0);},0);
    document.getElementById('stV').textContent='';document.getElementById('stP').textContent='';
    document.getElementById('rc').textContent=list.length+' producto'+(list.length!==1?'s':'');
    return;
  }

  /* ── Vista Tarjeta ── */
  if(vista==='tarjeta'){
    activeMode='tarjeta';
    grid.className='grid tarjeta-mode';
    var list=filterList();
    grid.innerHTML=list.length===0?'<div class="empty"><div style="font-size:44px">&#128270;</div><h3 style="color:#556677;margin-bottom:6px">Sin resultados</h3></div>':list.map(function(x){return renderTarjetaCard(x.p,x.i);}).join('');
    if(activeIdx!==null){var el=grid.querySelector('[data-idx="'+activeIdx+'"]');if(el)el.classList.add('active');}
    document.getElementById('stTL').textContent='Proveedores';document.getElementById('stCL').textContent='Calificados';
    document.getElementById('rc').textContent=list.length+' de '+PROVS.length+' proveedores';
    document.getElementById('stT').textContent=list.length;
    document.getElementById('stC').textContent=list.filter(function(x){return x.p.estatus==='Calificado';}).length;
    document.getElementById('stV').textContent=list.filter(function(x){return normAlerta(x.p.alerta).indexOf('vencido')===0;}).length;
    document.getElementById('stP').textContent=list.filter(function(x){return esPorVencer(x.p.alerta);}).length;
    return;
  }

  /* ── Vista Proveedores (default) ── */
  activeMode='prov';
  grid.className='grid';
  var list=filterList();
  grid.innerHTML=list.length===0?'<div class="empty"><div style="font-size:44px">&#128270;</div><h3 style="color:#556677;margin-bottom:6px">Sin resultados</h3><p>Ajusta los filtros.</p></div>':list.map(function(x){return renderProvCard(x.p,x.i);}).join('');
  if(activeIdx!==null){var el=grid.querySelector('[data-idx="'+activeIdx+'"]');if(el)el.classList.add('active');}
  document.getElementById('rc').textContent=list.length+' de '+PROVS.length+' proveedores';
  document.getElementById('stTL').textContent='Proveedores';document.getElementById('stCL').textContent='Calificados';
  document.getElementById('stT').textContent=list.length;
  document.getElementById('stC').textContent=list.filter(function(x){return x.p.estatus==='Calificado';}).length;
  document.getElementById('stV').textContent=list.filter(function(x){return normAlerta(x.p.alerta).indexOf('vencido')===0;}).length;
  document.getElementById('stP').textContent=list.filter(function(x){return esPorVencer(x.p.alerta);}).length;
}

/* ==== Carga en tiempo real desde Google Sheets ==== */
async function fetchCSV(url) {
  var res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status + " al obtener la hoja");
  var text = await res.text();
  return parseCSV(text);
}

/**
 * Igual que fetchCSV, pero para hojas que pueden traer filas de
 * título/instrucciones ANTES del encabezado real (como
 * "Seguimiento_AUD-PROV", que empieza con el título del programa y una
 * línea de instrucciones antes de la fila "N° PROVEEDOR,PROVEEDOR,...").
 * parseCSV() siempre asume que la primera línea es el encabezado, así que
 * aquí recortamos el texto crudo hasta encontrar esa fila real antes de
 * pasarlo a parseCSV(). Si el rango publicado ya empieza justo en el
 * encabezado (como venía funcionando antes), esto no cambia nada.
 */
async function fetchCSVSkippingPreamble(url) {
  var res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status + " al obtener la hoja");
  var text = await res.text();
  var lines = text.split(/\r\n|\r|\n/);
  var headerIdx = -1;
  for (var i = 0; i < lines.length; i++) {
    var firstCell = lines[i].split(",")[0].replace(/^"|"$/g, "").trim().toUpperCase();
    // El encabezado real es una celda corta tipo "N° PROVEEDOR" / "Nº PROVEEDOR".
    // Se exige que sea corta (<20 caracteres) para no confundirla con el
    // título del documento, que también contiene la palabra "Proveedores"
    // pero como parte de una oración larga.
    if (firstCell.indexOf("PROVEEDOR") !== -1 && firstCell.length < 20) { headerIdx = i; break; }
  }
  var cleanText = headerIdx >= 0 ? lines.slice(headerIdx).join("\n") : text;
  return parseCSV(cleanText);
}

async function loadAllData() {
  var overlay = document.getElementById("loadOverlay");
  var errBanner = document.getElementById("errBanner");
  var btnRefresh = document.getElementById("btnRefresh");
  var syncStatus = document.getElementById("syncStatus");
  if (errBanner) { errBanner.style.display = "none"; }
  if (btnRefresh) { btnRefresh.disabled = true; }
  if (syncStatus) { syncStatus.textContent = "Actualizando datos\u2026"; }
  if (overlay) { overlay.style.display = "flex"; }

  try {
    var results = await Promise.all([
      fetchCSV(CSV_URLS.base),
      fetchCSV(CSV_URLS.ficha),
      fetchCSV(CSV_URLS.productos),
      fetchCSVSkippingPreamble(CSV_URLS.calendario)
    ]);
    var baseRows = results[0], fichaRows = results[1], prodRows = results[2], calRows = results[3];

    var providers = buildProvidersFromBaseDatos(baseRows);
    var fichaMap = buildFichaByNProv(fichaRows);
    providers = mergeFichaIntoProviders(providers, fichaMap);
    var prodResult = buildProductosDet(prodRows);
    providers = mergeProductosIntoProviders(providers, prodResult.PD);

    RAW = providers;
    PRODS_ALL = prodResult.PA;
    PRODS_DET = prodResult.PD;
    PROGRAMA_AUD = buildProgramaAud(calRows);

    // Limpia los <select> dependientes de datos antes de repoblarlos
    // (init() los llena con appendChild; sin esto se duplicarian en cada refresh).
    document.getElementById("fProd").innerHTML = "<option value=\"\">Todos los productos</option>";
    document.getElementById("fCli").innerHTML = "<option value=\"\">Todos los clientes</option>";

    init();

    if (overlay) { overlay.style.display = "none"; }
    if (syncStatus) {
      var now = new Date();
      var hh = String(now.getHours()).padStart(2, "0");
      var mm = String(now.getMinutes()).padStart(2, "0");
      syncStatus.textContent = "Actualizado " + hh + ":" + mm;
    }
  } catch (err) {
    console.error("Error cargando datos desde Google Sheets:", err);
    if (overlay) { overlay.style.display = "none"; }
    if (errBanner) {
      errBanner.style.display = "block";
      errBanner.textContent = "\u26A0 No se pudo actualizar desde Google Sheets (" + (err && err.message ? err.message : "error desconocido") + "). Mostrando el ultimo dato cargado en esta pagina. Intenta actualizar de nuevo en unos segundos.";
    }
    if (syncStatus) { syncStatus.textContent = "Error al actualizar"; }
  } finally {
    if (btnRefresh) { btnRefresh.disabled = false; }
  }
}

loadAllData();

</script>
